# Waypoint M1 dev compose stack (issue #2, epic #1).
#
# Topology (docs/architecture.md component view; ADR-0001 packaging):
#   nginx (edge, TLS + static frontend + /api proxy)
#     -> backend (ASP.NET Core REST API, built from ../backend)
#        -> postgres (internal network only, no published port)
#
# Bring-up: see deploy/README.md. Requires deploy/nginx/certs/dev-cert.pem
# and dev-key.pem (deploy/nginx/certs/generate-dev-certs.sh), and a built
# ../frontend/dist (npm run build in frontend/) before `up`.

name: waypoint-dev

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: waypoint-nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WAYPOINT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Real frontend static build (issue #11 / #65), bind-mounted rather
      # than baked into an image so the existing nginx:1.27-alpine image
      # needs no custom build stage - same pattern already used for conf.d
      # and certs. Build it first: cd frontend && npm run build. If
      # ../frontend/dist does not exist yet, Docker silently creates an
      # empty host directory here and nginx serves an empty listing/404
      # instead of failing loudly - see deploy/README.md "Bring-up".
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The real ASP.NET Core backend (#3), replacing the nginx-based stub this
  # file shipped with. The service name (`backend`), the /api/v1/health
  # contract, and its position on the edge+internal networks are the
  # interface nginx and postgres depend on - unchanged across the swap.
  backend:
    build:
      context: ../backend
    container_name: waypoint-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dev-grade local auth (ADR-0004 rollout note; backend/README.md "Run
      # locally"). Empty by default so an unconfigured stack still fails
      # every login closed instead of shipping a guessable credential (see
      # Waypoint.Core.Configuration.LocalAuthOptions and
      # InMemoryLocalAuthenticationService). Set WAYPOINT_ADMIN_PASSWORD_HASH
      # to the SHA-256 hex digest of a password of your choosing - see
      # deploy/README.md "Bring-up" for how to compute it. Never commit a
      # real hash (or the plaintext password it hashes) to this repo.
      LocalAuth__AdminPasswordHash: "${WAYPOINT_ADMIN_PASSWORD_HASH:-}"
    volumes:
      - artifacts:/var/lib/waypoint/artifacts
      # Dev-only, gitignored, operator-borrowed depot token/config + the
      # hand-provisioned vcf-download-tool binary (see CLAUDE.md and
      # deploy/README.md "dev/local/ convention"). Uncomment once the
      # download jobs (M1 later slices) need it:
      # - ../dev/local:/dev/local:ro
    networks:
      - edge
      - internal
    # The image reports its own health; compose only invokes it (see
    # backend/README.md "Container health"). The .NET runtime image ships
    # neither wget nor curl, so the previous `wget --spider` probe could
    # never run - it failed every attempt and nginx, gated on
    # `condition: service_healthy`, never started.
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: waypoint-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` - reachable only from other containers on the internal
    # network (ADR-0002; issue #2 acceptance criteria). Not published to
    # the host, not reachable from the edge network nginx sits on.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  # nginx <-> backend. Published to the host via nginx's port mapping only.
  edge:
    driver: bridge
  # backend <-> postgres. internal: true means Docker gives this network no
  # route out (no host access, no default-gateway/internet); only containers
  # attached to it can reach each other. nginx is deliberately not attached.
  internal:
    driver: bridge
    internal: true

volumes:
  # Postgres data directory.
  pgdata:
  # Downloaded/extracted VCF artifacts and offline-repo storage (see
  # vcf-docker-download's UMDS/VCSA/VKS/ContentLibrary layout). Unused by
  # the backend today; mounted now so the path convention is fixed before
  # the download jobs (M1 later slices) land.
  artifacts:
