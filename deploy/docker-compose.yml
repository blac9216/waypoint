# Waypoint dev compose stack (issue #2, epic #1; runner topology issue #442,
# ADR-0013/0014/0015; runner egress issue #578).
#
# Topology (docs/architecture.md component view; ADR-0001 packaging):
#   nginx (edge, TLS + static frontend + /api proxy)
#     -> backend (ASP.NET Core control plane -- REST/RBAC/SSE, no execution)
#        -> postgres (internal network only, no published port)
#   compliance-runner (discover/credential-test/scan)
#     -> postgres (internal), lab/target infrastructure (runner-egress)
#   download-runner   (catalog-index/download)
#     -> postgres (internal), depot/internet in connected mode (runner-egress)
#
# The two runners are long-lived Generic Host services, not additional web APIs
# (ADR-0013 decision 3) -- they claim jobs directly from Postgres (ADR-0014
# decision 1) and are not reachable from nginx or the host. One replica of each is
# the default; ADR-0013 decision 6 explicitly does not multiply services without
# measured need. Each connects to Postgres as its own least-privilege role
# (waypoint_compliance_runner / waypoint_download_runner -- see the postgres
# service below and backend/Waypoint.Infrastructure/Data/Migrations/
# 0025_runner_db_roles.sql), separate from the backend's own waypoint/owner role.
#
# Issue #578: both runners previously sat ONLY on `internal` (no route out), so
# neither could resolve or reach anything outside the compose stack --
# compliance-runner cannot reach scan targets/STIG Manager, download-runner
# cannot reach the Broadcom depot. `runner-egress` (below) is a second,
# project-scoped bridge network (not `internal: true`) that gives both runners
# a route out while `postgres` stays on `internal` alone -- neither runner's
# new network reaches Postgres, and nothing on `edge`/`internal` gains a route
# out through this change. See deploy/README.md "Runner egress" for the
# disconnected/air-gapped operator override.
#
# Bring-up: `cd deploy && docker compose up -d`. Development-only
# bootstrap services generate persistent TLS/key/auth state in named volumes,
# and the nginx image builds the frontend itself. See deploy/README.md.

name: waypoint-dev

x-backend-image: &backend-image
  build:
    context: ..
    dockerfile: backend/Dockerfile

services:
  dev-bootstrap:
    build:
      context: ./dev-bootstrap
    volumes:
      - dev-secrets:/run/waypoint-dev-secrets
      - dev-tls:/run/waypoint-dev-tls
      - compliance-profiles:/opt/waypoint/profiles
    network_mode: none
    restart: "no"

  dev-auth-bootstrap:
    <<: *backend-image
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /run/waypoint-dev-secrets/local-auth-admin-password-hash ]; then
          printf '%s\n' "$$WAYPOINT_DEV_PASSWORD" \
            | dotnet Waypoint.Api.dll --hash-password \
            > /run/waypoint-dev-secrets/local-auth-admin-password-hash.tmp
          mv /run/waypoint-dev-secrets/local-auth-admin-password-hash.tmp \
            /run/waypoint-dev-secrets/local-auth-admin-password-hash
          chown 1654:1654 /run/waypoint-dev-secrets/local-auth-admin-password-hash
          chmod 600 /run/waypoint-dev-secrets/local-auth-admin-password-hash
        fi
    environment:
      WAYPOINT_DEV_PASSWORD: "${WAYPOINT_DEV_PASSWORD:-waypoint-dev}"
    volumes:
      - dev-secrets:/run/waypoint-dev-secrets
    network_mode: none
    restart: "no"

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      dev-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${WAYPOINT_HTTPS_PORT:-8443}:443"
    volumes:
      - dev-tls:/etc/nginx/certs:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The real ASP.NET Core backend (#3), replacing the nginx-based stub this
  # file shipped with. The service name (`backend`), the /api/v1/health
  # contract, and its position on the edge+internal networks are the
  # interface nginx and postgres depend on - unchanged across the swap.
  backend:
    <<: *backend-image
    depends_on:
      dev-auth-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Dev-grade local auth (ADR-0004 rollout note; backend/README.md "Run
      # locally"). Empty by default so an unconfigured stack still fails
      # every login closed instead of shipping a guessable credential (see
      # Waypoint.Core.Configuration.LocalAuthOptions and
      # InMemoryLocalAuthenticationService).
      #
      # Preferred delivery (issue #333): a mounted file, bind-mounted below
      # from ../config/local-auth/admin-password-hash (gitignored - see
      # .gitignore's /config/ entry and CLAUDE.md). This env var names the
      # in-container path; LocalAuthOptionsPostConfigure reads the hash from
      # it at startup and, when the file exists and is non-empty, it wins
      # over LocalAuth__AdminPasswordHash below. See deploy/README.md
      # "Bring-up" for how to generate the file's contents.
      LocalAuth__AdminPasswordHashFile: "/run/secrets/local-auth-admin-password-hash"
      # Legacy fallback (issue #62): only used when the mounted file above is
      # absent or empty (see LocalAuthOptionsPostConfigure). Env vars leak
      # via /proc/<pid>/environ, `docker inspect`, and crash dumps, so new
      # deployments should prefer the file above - this is kept working so
      # existing WAYPOINT_ADMIN_PASSWORD_HASH deployments' admin login does
      # not break. Set it to a salted PBKDF2 hash (Pbkdf2PasswordHasher,
      # issue #62) of a password of your choosing. Never commit a real hash
      # (or the plaintext password it hashes) to this repo.
      LocalAuth__AdminPasswordHash: "${WAYPOINT_ADMIN_PASSWORD_HASH:-}"
      # Off by default (issue #29) -- see deploy/README.md "Local auth
      # (dev-flag)". Set to "true" to re-enable the dev-grade local-session
      # scheme above alongside real OIDC; never set this on a production
      # deployment.
      LocalAuth__Enabled: "${LOCAL_AUTH_ENABLED:-true}"
      # Issue #29, ADR-0004: the backend validates Keycloak-issued bearer
      # tokens as a plain OIDC relying party. Authority drives DISCOVERY ONLY
      # (issue #536 -- see Oidc__ValidIssuer below for issuer validation) and
      # is this compose stack's own Keycloak service, reachable from
      # `backend` over the shared `internal` network (Keycloak's dev
      # listener is plain HTTP inside the compose network -- TLS is
      # terminated once, at nginx, same split as backend's own listener) --
      # RequireHttpsMetadata is false for exactly that reason in this dev
      # stack; a real deployment behind its own TLS-terminated Keycloak
      # should override both. Includes the /auth prefix
      # (KC_HTTP_RELATIVE_PATH below) because that prefix shifts EVERY URL
      # Keycloak serves, including on its internal container-network
      # listener, not just the nginx-proxied browser path (issue #536; this
      # was previously missing the prefix on this internal value even after
      # #534 added it to Oidc__PublicAuthority below). Audience must match
      # the realm's `waypoint-backend` client id
      # (deploy/keycloak/realm/waypoint-realm.json).
      Oidc__Authority: "${OIDC_AUTHORITY:-http://keycloak:8080/auth/realms/waypoint}"
      Oidc__Audience: "${OIDC_AUDIENCE:-waypoint-backend}"
      Oidc__RequireHttpsMetadata: "${OIDC_REQUIRE_HTTPS_METADATA:-false}"
      # Issue #536: the canonical issuer string every real token's `iss`
      # claim is checked against -- deliberately NOT derived from
      # Oidc__Authority above (ASP.NET Core's AddJwtBearer default), because
      # a browser-minted token's iss reflects Keycloak's KC_HOSTNAME-pinned
      # public identity (KC_HOSTNAME below), never the internal
      # keycloak:8080 address only `backend` can reach. Default matches this
      # dev stack's KC_HOSTNAME (localhost:8443, WAYPOINT_HTTPS_PORT's
      # default) -- an operator who overrides WAYPOINT_HTTPS_PORT or exposes
      # a real edge hostname MUST override this (and KC_HOSTNAME below)
      # together; see deploy/README.md "Keycloak" for the exact operator
      # override steps.
      Oidc__ValidIssuer: "${OIDC_VALID_ISSUER:-https://localhost:8443/auth/realms/waypoint}"
      # Issue #534: the BROWSER-facing authority + public client id, handed to
      # the SPA anonymously via GET /api/v1/auth/config so it never hardcodes
      # either. Deliberately NOT the same value as Oidc__Authority above --
      # that is the backend's container-network view of Keycloak
      # (http://keycloak:8080/...), which a browser can never reach. The
      # default here is nginx's own same-origin proxy path (`/auth/`,
      # deploy/nginx/conf.d/default.conf, issue #28) -- a relative path with
      # no host/port baked in, since an air-gapped appliance has no fixed
      # public hostname to assume. Override only if an operator's edge
      # topology puts Keycloak somewhere else relative to the browser.
      Oidc__PublicAuthority: "${OIDC_PUBLIC_AUTHORITY:-/auth/realms/waypoint}"
      Oidc__PublicClientId: "${OIDC_PUBLIC_CLIENT_ID:-waypoint-frontend}"
      # Postgres connection (#103): backend/appsettings.json bakes in a default
      # ConnectionStrings:Waypoint that happens to match the postgres service's
      # own defaults below, so an unconfigured stack still connects out of the
      # box (issue #4). But the two are not actually linked - Compose has no
      # way to interpolate one service's environment from another's inline, so
      # an operator who overrides POSTGRES_USER/PASSWORD/DB (the whole point of
      # the `${...:-default}` on the postgres service) needs the backend to
      # follow. This composes the standard ASP.NET Core double-underscore
      # environment override (Microsoft.Extensions.Configuration.EnvironmentVariables;
      # same mechanism as LocalAuth__AdminPasswordHash above) from the exact
      # same POSTGRES_* variables, so one set of overrides in .env covers both
      # containers. Host/port/sslmode are dev-stack constants, not operator
      # knobs: `postgres` is the internal-network service name (never resolvable
      # outside this compose stack) and 5432 is the container's fixed listen
      # port from the postgres:16-alpine image, so neither varies with the
      # operator's credential choice.
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=${POSTGRES_USER:-waypoint};Password=${POSTGRES_PASSWORD:-waypoint_dev_only}"
      # #191: narrows ForwardedHeaders:KnownNetworks (Program.cs) from the
      # whole-RFC-1918-space fallback to exactly the edge network's pinned
      # subnet (see the `edge` network's ipam config below) - the only network
      # nginx and the backend share, and the only source X-Forwarded-For/
      # X-Forwarded-Proto should ever be trusted from in this deployment.
      ForwardedHeaders__KnownNetworks__0: "${WAYPOINT_EDGE_SUBNET:-192.168.240.0/24}"
      # Secrets master key (issue #405; ADR-0005, AWX-pattern envelope
      # encryption). Preferred and only delivery path is a mounted file,
      # bind-mounted below from ../config/secrets/master.key (gitignored -
      # see .gitignore's /config/ entry and CLAUDE.md; same convention as
      # the admin-password-hash mount above). This env var names the
      # in-container path; FileMasterKeyProvider reads the key from it
      # lazily, on the first secret-store operation, not at startup - so an
      # unconfigured stack still comes up healthy and only a credential
      # write fails, with FileMasterKeyProvider's own
      # "No master key is configured..." error. There is no env-var
      # fallback here (unlike LocalAuth__AdminPasswordHash above):
      # FileMasterKeyProvider only ever reads a file, by design, since env
      # vars leak via /proc/<pid>/environ, `docker inspect`, and crash
      # dumps. See deploy/README.md "Bring-up" for how to generate the
      # key file's contents.
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
    volumes:
      # Read-only (issue #442 AC5: "backend no longer mounts execution scripts
      # or domain tool stores read-write"). ADR-0014 §7: "backend: read-only
      # artifact access where required to serve results/downloads" -- the
      # backend never writes an artifact itself (it has no execution
      # dispatcher, ADR-0013 §1), it only serves already-written scan/download
      # output back to the API caller. compliance-runner and download-runner
      # (below) hold the read-write mount for the same named volume.
      - artifacts:/var/lib/waypoint/artifacts:ro
      - dev-secrets:/run/secrets:ro
      # Admin password hash file (issue #333) - operator-provided, gitignored
      # (../config/ is covered by .gitignore's anchored /config/ entry).
      # Commented out by default so an unconfigured stack does not fail to
      # start on a missing bind source (unlike the frontend/dist mount above,
      # this one is optional: LocalAuthOptionsPostConfigure falls back to
      # LocalAuth__AdminPasswordHash, or to fail-closed local auth, when it's
      # absent). Uncomment and create
      # ../config/local-auth/admin-password-hash (see deploy/README.md
      # "Bring-up" step 3) to use the mounted-file delivery path instead of
      # the env var:
      # - type: bind
      #   source: ../config/local-auth/admin-password-hash
      #   target: /run/secrets/local-auth-admin-password-hash
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # Secrets master key file (issue #405) - operator-provided, gitignored
      # (../config/ is covered by .gitignore's anchored /config/ entry).
      # Commented out by default so an unconfigured stack does not fail to
      # start on a missing bind source: FileMasterKeyProvider only loads the
      # key lazily on first use (see the WAYPOINT_MASTER_KEY_FILE comment
      # above), so a stack without this mount still starts and reports
      # healthy - only a credential write (or anything else that touches
      # the secret store) fails, with FileMasterKeyProvider's own clean
      # fail-closed error. Uncomment and create
      # ../config/secrets/master.key (see deploy/README.md "Bring-up") to
      # enable the credential store:
      # - type: bind
      #   source: ../config/secrets/master.key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    networks:
      - edge
      - internal
    # The image reports its own health; compose only invokes it (see
    # backend/README.md "Container health"). The .NET runtime image ships
    # neither wget nor curl, so the previous `wget --spider` probe could
    # never run - it failed every attempt and nginx, gated on
    # `condition: service_healthy`, never started.
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      # Issue #442 (ADR-0014 §7): passwords for the two dedicated runner DB
      # roles postgres/initdb/01-runner-roles.sh creates on first init. Never
      # committed - override in deploy/.env (gitignored) alongside
      # POSTGRES_PASSWORD for anything beyond this dev-only default. Table
      # grants for these roles live in a versioned backend migration
      # (0025_runner_db_roles.sql), not here - see that file's header comment
      # for why role creation and grants are deliberately split.
      POSTGRES_COMPLIANCE_RUNNER_PASSWORD: ${POSTGRES_COMPLIANCE_RUNNER_PASSWORD:-waypoint_compliance_runner_dev_only}
      POSTGRES_DOWNLOAD_RUNNER_PASSWORD: ${POSTGRES_DOWNLOAD_RUNNER_PASSWORD:-waypoint_download_runner_dev_only}
      # Issue #28 (ADR-0004): password for Keycloak's own login role + database,
      # created by postgres/initdb/02-keycloak-db.sh on first init. Unlike the
      # two runner passwords above, this role OWNS its database outright
      # (Keycloak manages its own schema via its own migrations) rather than
      # receiving grants into the shared `waypoint` database - see that
      # script's header comment for why it deliberately does not follow the
      # 01-runner-roles.sh + 0025-migration grants pattern.
      POSTGRES_KEYCLOAK_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-waypoint_keycloak_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` - reachable only from other containers on the internal
    # network (ADR-0002; issue #2 acceptance criteria). Not published to
    # the host, not reachable from the edge network nginx sits on.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Keycloak (issue #28, ADR-0004): the IdP. The backend and frontend remain
  # plain OIDC relying parties (no Keycloak-specific application code), so
  # this service exists purely to authenticate and issue tokens - the
  # backend's own OIDC swap lands in #29. Straddles `edge` (nginx proxies to
  # it, same as `backend`) and `internal` (its own Postgres database) - the
  # same network shape as `backend`, deliberately: nginx -> keycloak is a
  # first-class proxy path per docs/architecture.md's component-view mermaid,
  # not an afterthought. Pinned image version (air-gap: no ":latest", no
  # runtime image resolution) - see deploy/README.md "Keycloak" for how an
  # operator air-gaps this pull per ADR-0015's source-build norms (Keycloak
  # itself is third-party, not project-owned code, so ADR-0015's "operator
  # builds from source" duty doesn't apply the way it does to backend/the two
  # runners - the norm that DOES apply is the same one nginx and postgres
  # already follow: pin a version, let the operator's own registry mirror or
  # pre-pulled image cache satisfy it in a disconnected environment).
  keycloak:
    build:
      context: ./keycloak
    # Issue #536: --hostname-strict=true is REQUIRED for KC_HOSTNAME (below) to
    # actually pin one canonical issuer -- hostname-strict=false ("Disables
    # dynamically resolving the hostname from request headers" per `kc.sh
    # --help-all`) is start-dev's implicit default, and live-verified to override
    # KC_HOSTNAME silently: the discovery document's `issuer` kept reflecting
    # whatever Host header the request arrived with even with KC_HOSTNAME set,
    # until this flag was added. This is the opposite of what "strict" sounds like
    # it should do relative to the old (v1) --hostname-strict semantics, so do not
    # "simplify" this back out without re-reading that live-verification note.
    command: ["start-dev", "--import-realm", "--http-enabled=true", "--hostname-strict=true", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Keycloak's own database - its dedicated login role + database from
      # postgres/initdb/02-keycloak-db.sh, NOT the shared `waypoint` database
      # backend/the runners use (see that script's header comment and the
      # postgres service's own comment above).
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-waypoint_keycloak_dev_only}
      # Dev-stack bootstrap admin (Keycloak's own bootstrap-admin mechanism,
      # analogous to backend's LocalAuth admin password - issue #333's
      # reasoning applies equally here). Dev-only default so an unconfigured
      # stack still comes up with a usable admin console login; override in
      # deploy/.env for anything beyond local dev, same convention as every
      # other POSTGRES_*/WAYPOINT_* dev default in this file.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-waypoint_keycloak_admin_dev_only}
      # start-dev's HTTP listener is fine here: TLS is terminated once, at
      # nginx (operator-provided certs, ADR-0003) - same split as backend,
      # which also listens on plain HTTP behind the edge network.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # Issue #536: pins Keycloak's hostname-v2 provider (the default since
      # Keycloak 22, still active here) to ONE canonical public identity
      # instead of the request-derived behavior `--hostname-strict=false`
      # (start-dev's own implicit default) previously left in place. Without
      # this (and --hostname-strict=true above -- live-verified required:
      # hostname-strict=false silently keeps deriving from request headers
      # even with KC_HOSTNAME set), Keycloak echoes back whatever
      # Host/X-Forwarded-* header the request arrived with as its `iss`
      # claim -- a browser request through nginx and a direct
      # container-network request from `backend` disagree, so no single
      # ValidIssuer string on the backend could ever match both (the actual
      # bug this issue fixes).
      #
      # MUST include the /auth path explicitly (live-verified: hostname-v2
      # does NOT automatically append KC_HTTP_RELATIVE_PATH below to
      # KC_HOSTNAME the way it does for the port/scheme) -- without it every
      # self-referential URL, including `iss`, renders without the /auth
      # prefix and 404s through nginx's `/auth/` proxy. Default matches this
      # dev stack's own edge port (WAYPOINT_HTTPS_PORT's default, 8443) --
      # an operator overriding WAYPOINT_HTTPS_PORT or fronting the stack
      # with a real hostname MUST override this together with the backend's
      # Oidc__ValidIssuer above (same value, plus the /realms/waypoint
      # suffix) -- see deploy/README.md "Keycloak" for the exact override
      # steps. This is air-gap-safe: KC_HOSTNAME names Keycloak's own
      # identity for URL rendering, it is never dialled out to -- no
      # external endpoint, no ACME, no phone-home.
      KC_HOSTNAME: "${KC_HOSTNAME:-https://localhost:8443/auth}"
      # Issue #534 (live-verified): without this, Keycloak has no idea it is
      # reverse-proxied under nginx's /auth/ prefix (deploy/nginx/conf.d
      # default.conf's `location /auth/`) and renders every self-referential
      # URL -- the discovery document's authorization_endpoint/token_endpoint,
      # and every login-form `action=` on its own HTML pages -- WITHOUT the
      # /auth prefix. A real browser (or this SPA) following any of those
      # URLs then hits nginx with a bare /realms/... path, which has no
      # matching location and falls through to the frontend's SPA catch-all
      # -- a silent, totally-broken login redirect, not an obvious error.
      # KC_HTTP_RELATIVE_PATH tells Keycloak's own URL-building to include
      # the prefix it is actually served under, matching nginx's proxy path
      # exactly. Verified against a real bring-up (docs/testing.md isolation
      # recipe): before this line, GET .../auth/realms/waypoint/.well-known/
      # openid-configuration's authorization_endpoint was
      # https://<host>/realms/waypoint/protocol/openid-connect/auth (missing
      # /auth); after it, https://<host>/auth/realms/waypoint/... (correct).
      KC_HTTP_RELATIVE_PATH: "/auth"
    networks:
      - edge
      - internal
    # No published ports - reachable only via nginx's proxy path (edge
    # network) or from other edge/internal containers, never directly from
    # the host, matching backend's own no-`ports:` convention.
    # --health-enabled=true (above) serves /health/ready on the management
    # port (9000 by default, separate from the 8080 app port) rather than
    # the main HTTP listener - this image ships neither curl nor wget, so
    # the probe is a raw /dev/tcp request (same technique as this file's
    # other CMD-SHELL health checks that lack a dedicated HTTP client).
    #
    # Path is /auth/health/ready, not /health/ready (issue #534,
    # live-verified): KC_HTTP_RELATIVE_PATH=/auth above shifts EVERY
    # Keycloak-served path under that prefix, including the management
    # port's own health endpoints, not just the main app's realm/admin
    # routes - verified against a real bring-up that a bare /health/ready
    # 404s once KC_HTTP_RELATIVE_PATH is set, and /auth/health/ready is what
    # actually answers "UP".
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  # compliance-runner (issue #442, ADR-0013/0014): claims discover/credential-test/
  # scan (later remediate) jobs directly from Postgres and hosts PowerShell/PowerCLI/
  # cinc-auditor/SAF in-process. Not reachable from nginx or the host - no
  # `ports:`, ever. On `internal` for Postgres and `runner-egress` (issue #578)
  # for lab/target reachability (vCenter/ESXi/NSX/SRG/STIG Manager) - the
  # latter is the only network this service can dial out on; it still has no
  # route back in from either network. One replica by default (ADR-0013
  # decision 6); see "Replica-safe scaling" in deploy/README.md before setting
  # `deploy.replicas` > 1.
  compliance-runner:
    build:
      # Repo-root context, same convention as backend (issue #92) - this image's
      # own dotnet-build stage needs backend/ too. See
      # runners/compliance-runner/Dockerfile's header comment.
      context: ..
      dockerfile: runners/compliance-runner/Dockerfile
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Least-privilege role (0025_runner_db_roles.sql), distinct from the
      # backend's own ${POSTGRES_USER} owner role - see postgres service above
      # and that migration's header comment.
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=waypoint_compliance_runner;Password=${POSTGRES_COMPLIANCE_RUNNER_PASSWORD:-waypoint_compliance_runner_dev_only}"
      # Same file-delivery convention and in-container path as the backend's own
      # mount below (issue #405/ADR-0005) - every trusted service reads the same
      # key material, never an env var carrying the key itself.
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
      RunnerResources__FallbackCpuCores: "${RUNNER_FALLBACK_CPU_CORES:-4}"
      RunnerResources__FallbackMemoryBytes: "${RUNNER_FALLBACK_MEMORY_BYTES:-4294967296}"
      # Shim modules baked into the image at /app/PowerShell/Modules (Waypoint.
      # Infrastructure.csproj's CopyToPublishDirectory - see the Dockerfile).
      # Preload order matches the mapping deploy/README.md previously documented
      # on the backend service - now this service's own. WaypointLogging preloads
      # FIRST (issue #579): it provides Get-LogSplat/Write-Log, which the imported
      # vmware-stig-docker transport files dot-sourced by the other three modules
      # expect to already be in scope.
      # Issue #613 (live-verified): WaypointComplianceContent was never added to
      # this list, so Invoke-WaypointComplianceContentPull was undefined in the
      # runspace and content-pull/content-import always failed with "term ...
      # is not recognized". ComplianceContentJobHandlerTests' preload-completeness
      # guard (Waypoint.Tests) fails the build if a future handler's module ships
      # without an entry here.
      PowerShell__ModulePreloadPaths__0: "/app/PowerShell/Modules/WaypointLogging"
      PowerShell__ModulePreloadPaths__1: "/app/PowerShell/Modules/WaypointDiscovery"
      PowerShell__ModulePreloadPaths__2: "/app/PowerShell/Modules/WaypointScan"
      PowerShell__ModulePreloadPaths__3: "/app/PowerShell/Modules/WaypointCredentialTest"
      PowerShell__ModulePreloadPaths__4: "/app/PowerShell/Modules/WaypointComplianceContent"
      # Project-owned .ps1 files the shims above dot-source, baked into the image under
      # /powershell/ (runners/compliance-runner/powershell/, imported from the
      # vmware-stig-docker sibling repo per CLAUDE.md's borrowing policy) -
      # replaces the backend's former host bind mount (issue #395/#427) now that
      # the sibling-repository source lives in this repository (ADR-0015 decision 2).
      WAYPOINT_VMWARE_STIG_DOCKER_TRANSPORT_PATH: "/powershell/module.transport.vmware.ps1"
      WAYPOINT_VMWARE_STIG_DOCKER_NSXAPI_PATH: "/powershell/module.transport.nsxapi.ps1"
      WAYPOINT_VMWARE_STIG_DOCKER_COMMON_PATH: "/powershell/module.common.ps1"
    volumes:
      # Compliance content (InSpec profiles) - read-only (ADR-0014 §7: "compliance
      # runner: compliance-content read access"). Operator-provided; a
      # provisioning UI is future work, so this is a plain named volume an
      # operator populates directly for now (matches ScanOptions' ProfilePath/
      # NsxProfilePath/SrgProfilePath defaults, all under this one root).
      - compliance-profiles:/opt/waypoint/profiles:ro
      - dev-secrets:/run/secrets:ro
      # Scan artifacts (HDF/CKL) - read-write (ADR-0014 §7: "scan-artifact write
      # access"). Same named volume the backend mounts read-only above, so the
      # API can serve already-written results without itself being able to
      # write into the store.
      - artifacts:/var/lib/waypoint/artifacts
      # content-pull/content-import working tree (ADR-0017; issue #616,
      # live-verified) - read-write, this service only. Matches
      # ComplianceContentOptions.ContentPath's default. Without this named
      # volume the clone target does not exist at all, and even if the app
      # created it itself it would be root-owned like every other Compose
      # mount point until docker-entrypoint.sh chowns it below (same fix
      # shape as the download-runner's managed-tool volume).
      - compliance-content:/var/lib/waypoint/compliance-content
      # Secrets master key file (issue #405/#442) - operator-provided, gitignored
      # (../config/ is covered by .gitignore's anchored /config/ entry). Same
      # file, same in-container path, and the same optional/fail-closed
      # behavior as the backend's own mount above: discover/credential-test/
      # scan all decrypt a credential before doing anything else (ADR-0014 §6),
      # so a runner that cannot reach this key still starts and reports
      # healthy, but every job it claims fails until the key is mounted. See
      # deploy/README.md "Bring-up" step 4 - the same uid/permission note
      # applies (this image's app user is also uid 1654; see the Dockerfile).
      # Uncomment and create ../config/secrets/master.key to enable:
      # - type: bind
      #   source: ../config/secrets/master.key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    networks:
      - internal
      - runner-egress
    # File-sentinel healthcheck (ADR-0013 §1: this process has no HTTP listener
    # to probe) - RunnerHealthReportingHostedService re-evaluates readiness every
    # RunnerHealth:RefreshInterval and writes a JSON report; --health-check reads
    # it back and exits 0/1. See ComplianceReadinessCheck's doc comment for
    # exactly what "ready" means here (module/content/artifact mounts + master
    # key, deliberately not InSpec/PowerCLI binary presence).
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.ComplianceRunner.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # download-runner (issue #442, ADR-0013/0014): claims catalog-index/download
  # (later content-library/repository/managed-content) jobs directly from Postgres
  # and hosts PowerShell in-process. Not reachable from nginx or the host - no
  # `ports:`, ever. On `internal` for Postgres and `runner-egress` (issue #578)
  # for the Broadcom depot/operator repositories in connected mode - the latter
  # is the only network this service can dial out on; it still has no route
  # back in from either network. In a disconnected deployment this network
  # carries no traffic (download features are hidden/disabled per
  # docs/architecture.md's connected/disconnected mode table) but stays
  # attached rather than becoming a per-mode compose variant - see
  # deploy/README.md "Runner egress" for the operator-facing egress lockdown
  # note. One replica by default (ADR-0013 decision 6); see "Replica-safe
  # scaling" in deploy/README.md before setting `deploy.replicas` > 1.
  download-runner:
    build:
      context: ..
      dockerfile: runners/download-runner/Dockerfile
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Least-privilege role (0025_runner_db_roles.sql), distinct from the
      # backend's own ${POSTGRES_USER} owner role - see postgres service above
      # and that migration's header comment.
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=waypoint_download_runner;Password=${POSTGRES_DOWNLOAD_RUNNER_PASSWORD:-waypoint_download_runner_dev_only}"
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
      # Shim modules baked into the image at /app/PowerShell/Modules (Waypoint.
      # Infrastructure.csproj's CopyToPublishDirectory - see the Dockerfile).
      # WaypointDownload was missing from this list on `main` even before this
      # issue (pre-existing gap, not introduced here) - DownloadJobHandler
      # invokes Invoke-WaypointDownload, which only exists once this module is
      # preloaded into the runspace (WaypointRunspacePool.CreateRunspace only
      # imports what ModulePreloadPaths names). Included here alongside
      # WaypointCatalogIndex now that this is this service's own config.
      PowerShell__ModulePreloadPaths__0: "/app/PowerShell/Modules/WaypointCatalogIndex"
      PowerShell__ModulePreloadPaths__1: "/app/PowerShell/Modules/WaypointDownload"
      # Project-owned script baked into the image under /app/PowerShell/project
      # (runners/download-runner/powershell/project/, imported from the
      # vcf-docker-download sibling repo per CLAUDE.md's borrowing policy) -
      # replaces the backend's former host bind mount (issue #223) now that the
      # sibling-repository source lives in this repository (ADR-0015 decision 2).
      WAYPOINT_VCF_DOWNLOAD_MANAGER_COMMON_PATH: "/app/PowerShell/project/vcf-download-manager.common.ps1"
    volumes:
      # Offline depot share to index - read-write (ADR-0014 §7: "download
      # runner: managed tool/depot/content write access"). Matches CatalogOptions'
      # DepotPath default.
      - depot:/vcf
      # Download artifact store - read-write. Same named volume the backend
      # mounts read-only above.
      - artifacts:/var/lib/waypoint/artifacts
      # Operator-installed managed tool state (ADR-0015 decision 3): the
      # account-gated vcf-download-tool executable lands here through a future
      # appliance install flow, never baked into this image. Matches
      # ManagedToolOptions' ToolStatePath default. Read-write so that future
      # install flow can place the binary; download jobs only ever read it.
      - managed-tool:/var/lib/waypoint/managed-tool
      - dev-secrets:/run/secrets:ro
      # Secrets master key file (issue #405/#442) - same convention as
      # compliance-runner's own mount above; catalog-index resolves the depot
      # token credential and download resolves the target credential, both
      # through this key (ADR-0014 §6). Uncomment and create
      # ../config/secrets/master.key to enable:
      # - type: bind
      #   source: ../config/secrets/master.key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    networks:
      - internal
      - runner-egress
    # File-sentinel healthcheck, same convention as compliance-runner above -
    # see ReadinessReportingHostedService/HealthCheckProbe's doc comments. Unlike
    # the compliance-runner's check, this one also confirms Postgres
    # reachability (CheckDatabaseAsync) as part of "ready".
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.DownloadRunner.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  # nginx <-> backend. Published to the host via nginx's port mapping only.
  # Subnet pinned (#191) so ForwardedHeaders:KnownNetworks (backend env below,
  # Program.cs) can trust exactly this network instead of all of RFC 1918.
  # The chosen /24 sits outside Docker's default address pool (the top of the
  # 172.16.0.0/12 space, consumed top-down as bridge networks are created --
  # this shared host's concurrent stacks already occupy several /16s there,
  # see docs/testing.md) and outside the handful of /24s a typical home/office
  # LAN or a nested Docker host is likely to already be using in the low
  # 192.168.0.0/16 range, so a fixed subnet is unlikely to collide with either
  # source on a shared or nested host. Only `edge` is pinned; `internal` has
  # no route out (see below) so a fixed subnet buys it nothing.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: "${WAYPOINT_EDGE_SUBNET:-192.168.240.0/24}"
  # backend, compliance-runner, download-runner <-> postgres. internal: true
  # means Docker gives this network no route out (no host access, no
  # default-gateway/internet); only containers attached to it can reach each
  # other. nginx is deliberately not attached - neither runner is reachable
  # from nginx or the host (issue #442).
  internal:
    driver: bridge
    internal: true
  # compliance-runner, download-runner <-> lab/target infrastructure and the
  # internet (issue #578). A normal (non-`internal:`) bridge network, so Docker
  # gives it a default gateway/route out through the host -- deliberately the
  # ONLY network attribute that differs from `internal` above. Project-scoped
  # like every other network in this file (Compose namespaces it
  # `<project>_runner-egress`, per docs/testing.md's isolation recipe) --
  # never external/shared, so concurrent stacks on one Docker host still don't
  # collide. No `ports:` on either attached service and no other service is
  # attached to this network, so it grants outbound reachability only -
  # nothing gains a new path IN to compliance-runner/download-runner, and
  # postgres/backend/nginx/keycloak are unaffected (still exactly `edge`/
  # `internal` as before). An operator running a disconnected/air-gapped
  # instance who wants to physically remove even this egress path (e.g. no
  # download-runner internet route at all) can override this network's driver
  # options or detach download-runner from it in a docker-compose.override.yml
  # -- see deploy/README.md "Runner egress".
  runner-egress:
    driver: bridge

volumes:
  # Generated development-only master key and local-auth hash. Persistent so
  # encrypted credentials survive ordinary down/up cycles; `down -v` resets it.
  dev-secrets:
  # Generated development-only self-signed nginx certificate and key.
  dev-tls:
  # Postgres data directory.
  pgdata:
  # Scan (compliance-runner) and download (download-runner) artifact output.
  # download-runner and compliance-runner both mount this read-write; backend
  # mounts it read-only to serve already-written results (issue #442 AC5).
  artifacts:
  # Offline depot share (see vcf-docker-download's UMDS/VCSA/VKS/ContentLibrary
  # layout) - download-runner only.
  depot:
  # Operator-installed managed tool state (ADR-0015 decision 3, e.g. the
  # account-gated vcf-download-tool) - download-runner only.
  managed-tool:
  # Compliance content (InSpec profiles) - compliance-runner only, read-only at
  # the mount (see that service's volumes:).
  compliance-profiles:
  # content-pull/content-import working tree (ADR-0017, issue #616) -
  # compliance-runner only, read-write at the mount (see that service's
  # volumes:). Distinct from compliance-profiles above: this is the git
  # clone target content-pull writes into, not the operator-provisioned
  # read-only profile set scan/discover/credential-test consume.
  compliance-content:
