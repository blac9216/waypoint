# Waypoint M1 dev compose stack (issue #2, epic #1).
#
# Topology (docs/architecture.md component view; ADR-0001 packaging):
#   nginx (edge, TLS + static frontend + /api proxy)
#     -> backend (ASP.NET Core REST API, built from ../backend)
#        -> postgres (internal network only, no published port)
#
# Bring-up: see deploy/README.md. Requires deploy/nginx/certs/dev-cert.pem
# and dev-key.pem (deploy/nginx/certs/generate-dev-certs.sh), and a built
# ../frontend/dist (npm run build in frontend/) before `up`.

name: waypoint-dev

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WAYPOINT_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Real frontend static build (issue #11 / #65), bind-mounted rather
      # than baked into an image so the existing nginx:1.27-alpine image
      # needs no custom build stage - same pattern already used for conf.d
      # and certs. Build it first: cd frontend && npm run build.
      #
      # Long syntax with `create_host_path: false` on purpose. Docker's
      # default for a bind mount is to CREATE a missing source path - as a
      # root-owned empty directory - so forgetting the build step would
      # bring the stack up "healthy" while nginx served a bare 403 Forbidden
      # (try_files falls through to an empty dir, autoindex off), and would
      # leave behind a root-owned ../frontend/dist that a non-root operator
      # then cannot `npm run build` into (EACCES) without sudo. Refusing the
      # mount instead fails the `up` immediately with
      #   invalid mount config for type "bind": bind source path does not
      #   exist: .../frontend/dist
      # and creates nothing.
      #
      # It guards the ABSENT case only: an ../frontend/dist that exists but is
      # EMPTY still mounts, still comes up "healthy", and still serves that
      # same bare 403. `vite build` empties outDir before writing, so a build
      # that fails partway lands exactly there - the 403 has not gone away,
      # it just no longer happens from forgetting the build entirely.
      # See deploy/README.md "Bring-up" step 2.
      - type: bind
        source: ../frontend/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The real ASP.NET Core backend (#3), replacing the nginx-based stub this
  # file shipped with. The service name (`backend`), the /api/v1/health
  # contract, and its position on the edge+internal networks are the
  # interface nginx and postgres depend on - unchanged across the swap.
  backend:
    build:
      # Context is the repo root, not ../backend (issue #92): .editorconfig and
      # Directory.Build.props live at the repo root, and a backend/-scoped context put
      # the containerized compile's analyzer posture at the SDK defaults instead of this
      # repo's (see backend/Dockerfile's header comment for the full mechanism).
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dev-grade local auth (ADR-0004 rollout note; backend/README.md "Run
      # locally"). Empty by default so an unconfigured stack still fails
      # every login closed instead of shipping a guessable credential (see
      # Waypoint.Core.Configuration.LocalAuthOptions and
      # InMemoryLocalAuthenticationService).
      #
      # Preferred delivery (issue #333): a mounted file, bind-mounted below
      # from ../config/local-auth/admin-password-hash (gitignored - see
      # .gitignore's /config/ entry and CLAUDE.md). This env var names the
      # in-container path; LocalAuthOptionsPostConfigure reads the hash from
      # it at startup and, when the file exists and is non-empty, it wins
      # over LocalAuth__AdminPasswordHash below. See deploy/README.md
      # "Bring-up" for how to generate the file's contents.
      LocalAuth__AdminPasswordHashFile: "/run/secrets/local-auth-admin-password-hash"
      # Legacy fallback (issue #62): only used when the mounted file above is
      # absent or empty (see LocalAuthOptionsPostConfigure). Env vars leak
      # via /proc/<pid>/environ, `docker inspect`, and crash dumps, so new
      # deployments should prefer the file above - this is kept working so
      # existing WAYPOINT_ADMIN_PASSWORD_HASH deployments' admin login does
      # not break. Set it to a salted PBKDF2 hash (Pbkdf2PasswordHasher,
      # issue #62) of a password of your choosing. Never commit a real hash
      # (or the plaintext password it hashes) to this repo.
      LocalAuth__AdminPasswordHash: "${WAYPOINT_ADMIN_PASSWORD_HASH:-}"
      # Postgres connection (#103): backend/appsettings.json bakes in a default
      # ConnectionStrings:Waypoint that happens to match the postgres service's
      # own defaults below, so an unconfigured stack still connects out of the
      # box (issue #4). But the two are not actually linked - Compose has no
      # way to interpolate one service's environment from another's inline, so
      # an operator who overrides POSTGRES_USER/PASSWORD/DB (the whole point of
      # the `${...:-default}` on the postgres service) needs the backend to
      # follow. This composes the standard ASP.NET Core double-underscore
      # environment override (Microsoft.Extensions.Configuration.EnvironmentVariables;
      # same mechanism as LocalAuth__AdminPasswordHash above) from the exact
      # same POSTGRES_* variables, so one set of overrides in .env covers both
      # containers. Host/port/sslmode are dev-stack constants, not operator
      # knobs: `postgres` is the internal-network service name (never resolvable
      # outside this compose stack) and 5432 is the container's fixed listen
      # port from the postgres:16-alpine image, so neither varies with the
      # operator's credential choice.
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=${POSTGRES_USER:-waypoint};Password=${POSTGRES_PASSWORD:-waypoint_dev_only}"
      # #191: narrows ForwardedHeaders:KnownNetworks (Program.cs) from the
      # whole-RFC-1918-space fallback to exactly the edge network's pinned
      # subnet (see the `edge` network's ipam config below) - the only network
      # nginx and the backend share, and the only source X-Forwarded-For/
      # X-Forwarded-Proto should ever be trusted from in this deployment.
      ForwardedHeaders__KnownNetworks__0: "192.168.240.0/24"
      # Secrets master key (issue #405; ADR-0005, AWX-pattern envelope
      # encryption). Preferred and only delivery path is a mounted file,
      # bind-mounted below from ../config/secrets/master.key (gitignored -
      # see .gitignore's /config/ entry and CLAUDE.md; same convention as
      # the admin-password-hash mount above). This env var names the
      # in-container path; FileMasterKeyProvider reads the key from it
      # lazily, on the first secret-store operation, not at startup - so an
      # unconfigured stack still comes up healthy and only a credential
      # write fails, with FileMasterKeyProvider's own
      # "No master key is configured..." error. There is no env-var
      # fallback here (unlike LocalAuth__AdminPasswordHash above):
      # FileMasterKeyProvider only ever reads a file, by design, since env
      # vars leak via /proc/<pid>/environ, `docker inspect`, and crash
      # dumps. See deploy/README.md "Bring-up" for how to generate the
      # key file's contents.
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
      # #223: points the PowerShell runspace pool (WaypointRunspacePool,
      # ADR-0006) at the Waypoint-owned shim module that dot-sources the
      # sibling vcf-docker-download repo's UNMODIFIED vcf-download-manager
      # scripts (issue #194; CLAUDE.md License & Borrowing Policy - vendor
      # scripts run as unmodified vendor code, never copied into this repo
      # or baked into the image). The in-container path is fixed - it's
      # where the Waypoint.Infrastructure build output already places the
      # shim module, not something the operator configures - so this is a
      # plain literal, not a ${...} env override. Module import happens
      # lazily on first runspace rent (WaypointRunspacePool.CreateRunspace),
      # never at DI construction or app startup, so an unconfigured stack
      # (no scripts mounted below) still starts and reports healthy; only a
      # job that actually dispatches into PowerShell fails, with the shim's
      # own "no vcf-download-manager.common.ps1 path configured" error
      # surfacing in that job's log rather than blocking the whole stack.
      PowerShell__ModulePreloadPaths__0: "/app/PowerShell/Modules/WaypointCatalogIndex"
      # Companion to the module path above: the shim reads the vendor
      # script's location from this env var rather than a hardcoded path
      # (see WaypointCatalogIndex.psm1's $Script:VcfDownloadManagerCommonPath).
      # Points inside the read-only vcf-scripts mount below; matches
      # whatever relative layout the operator's vcf-docker-download checkout
      # uses under powershell/ (vcf-download-manager.common.ps1 lives at the
      # top of that directory in the sibling repo today).
      WAYPOINT_VCF_DOWNLOAD_MANAGER_COMMON_PATH: "/vcf-scripts/vcf-download-manager.common.ps1"
      # #395: extends the #223 pattern above to the *other* sibling repo,
      # vmware-stig-docker - the vendor source for the discover/scan/
      # credential-test job handlers' shim modules (WaypointDiscovery,
      # WaypointScan, WaypointCredentialTest under
      # backend/Waypoint.Infrastructure/PowerShell/Modules/). WaypointDownload
      # is deliberately NOT listed here: it dot-sources
      # vcf-download-manager.common.ps1 from the *vcf-docker-download* sibling
      # (the #223 mount/env above), not vmware-stig-docker, so it needs no
      # additional wiring. Preload three more shim modules, appending to
      # index 0 above rather than disturbing it - WaypointRunspacePool imports
      # every configured index into each runspace, in order, so index 0
      # (WaypointCatalogIndex) is unaffected by these additions.
      PowerShell__ModulePreloadPaths__1: "/app/PowerShell/Modules/WaypointDiscovery"
      PowerShell__ModulePreloadPaths__2: "/app/PowerShell/Modules/WaypointScan"
      PowerShell__ModulePreloadPaths__3: "/app/PowerShell/Modules/WaypointCredentialTest"
      # The three vendor script paths the shims above read (see each
      # module's $env: reads - e.g. WaypointDiscovery.psm1's
      # $Script:VmwareStigDockerModulePath). Point inside the read-only
      # vmware-stig-docker-scripts mount below; the relative subpaths match
      # the sibling repo's powershell/ directory layout, where every
      # module.*.ps1 file (transport, nsxapi, common, and the rest) lives
      # flat at the top level - described generically here per CLAUDE.md
      # (no host paths committed).
      WAYPOINT_VMWARE_STIG_DOCKER_TRANSPORT_PATH: "/vmware-stig-docker-scripts/module.transport.vmware.ps1"
      WAYPOINT_VMWARE_STIG_DOCKER_NSXAPI_PATH: "/vmware-stig-docker-scripts/module.transport.nsxapi.ps1"
      WAYPOINT_VMWARE_STIG_DOCKER_COMMON_PATH: "/vmware-stig-docker-scripts/module.common.ps1"
    volumes:
      - artifacts:/var/lib/waypoint/artifacts
      # Dev-only, gitignored, operator-borrowed depot token/config + the
      # hand-provisioned vcf-download-tool binary (see CLAUDE.md and
      # deploy/README.md "dev/local/ convention"). Uncomment once the
      # download jobs (M1 later slices) need it:
      # - ../dev/local:/dev/local:ro
      # Sibling vcf-docker-download repo's PowerShell scripts (issue #223),
      # read-only. Same repo-root dev/local/ convention as the mount above
      # (../dev/local, relative to this file in deploy/): never committed,
      # borrowed from the operator's own checkout of the sibling repo.
      # Defaults to ../dev/local/vcf-scripts (gitignored - .gitignore's
      # dev/local/ entry) so an operator following the existing convention
      # just points WAYPOINT_VCF_SCRIPTS_DIR at their sibling repo's
      # powershell/ directory in deploy/.env; left unset, this mounts
      # whatever (possibly nonexistent) ../dev/local/vcf-scripts resolves to.
      # Uses the default bind-mount behavior (NOT create_host_path: false,
      # unlike the frontend/dist mount above) on purpose: this material is
      # optional and lazily consumed (see the ModulePreloadPaths comment
      # above), so a missing source should not block the whole stack from
      # coming up - Docker creates an empty directory in that case and the
      # shim's own "not found" error only surfaces if a catalog-index job
      # actually runs.
      - ${WAYPOINT_VCF_SCRIPTS_DIR:-../dev/local/vcf-scripts}:/vcf-scripts:ro
      # Sibling vmware-stig-docker repo's PowerShell scripts (issue #395),
      # read-only. Same repo-root dev/local/ convention as the mount above,
      # its own subpath so it doesn't collide with vcf-scripts' contents.
      # Defaults to ../dev/local/vmware-stig-docker-scripts (gitignored -
      # .gitignore's dev/local/ entry) so an operator points
      # WAYPOINT_VMWARE_STIG_DOCKER_SCRIPTS_DIR at their sibling repo's
      # powershell/ directory in deploy/.env; left unset, this mounts
      # whatever (possibly nonexistent) ../dev/local/vmware-stig-docker-scripts
      # resolves to. Same default bind-mount behavior as vcf-scripts above
      # (NOT create_host_path: false) on purpose - this material is optional
      # and lazily consumed (see the ModulePreloadPaths comment above), so a
      # missing source should not block the whole stack from coming up -
      # Docker creates an empty directory in that case and each shim's own
      # "not found" error only surfaces if a discover/scan/credential-test
      # job actually runs.
      - ${WAYPOINT_VMWARE_STIG_DOCKER_SCRIPTS_DIR:-../dev/local/vmware-stig-docker-scripts}:/vmware-stig-docker-scripts:ro
      # Admin password hash file (issue #333) - operator-provided, gitignored
      # (../config/ is covered by .gitignore's anchored /config/ entry).
      # Commented out by default so an unconfigured stack does not fail to
      # start on a missing bind source (unlike the frontend/dist mount above,
      # this one is optional: LocalAuthOptionsPostConfigure falls back to
      # LocalAuth__AdminPasswordHash, or to fail-closed local auth, when it's
      # absent). Uncomment and create
      # ../config/local-auth/admin-password-hash (see deploy/README.md
      # "Bring-up" step 3) to use the mounted-file delivery path instead of
      # the env var:
      # - type: bind
      #   source: ../config/local-auth/admin-password-hash
      #   target: /run/secrets/local-auth-admin-password-hash
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # Secrets master key file (issue #405) - operator-provided, gitignored
      # (../config/ is covered by .gitignore's anchored /config/ entry).
      # Commented out by default so an unconfigured stack does not fail to
      # start on a missing bind source: FileMasterKeyProvider only loads the
      # key lazily on first use (see the WAYPOINT_MASTER_KEY_FILE comment
      # above), so a stack without this mount still starts and reports
      # healthy - only a credential write (or anything else that touches
      # the secret store) fails, with FileMasterKeyProvider's own clean
      # fail-closed error. Uncomment and create
      # ../config/secrets/master.key (see deploy/README.md "Bring-up") to
      # enable the credential store:
      # - type: bind
      #   source: ../config/secrets/master.key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    networks:
      - edge
      - internal
    # The image reports its own health; compose only invokes it (see
    # backend/README.md "Container health"). The .NET runtime image ships
    # neither wget nor curl, so the previous `wget --spider` probe could
    # never run - it failed every attempt and nginx, gated on
    # `condition: service_healthy`, never started.
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` - reachable only from other containers on the internal
    # network (ADR-0002; issue #2 acceptance criteria). Not published to
    # the host, not reachable from the edge network nginx sits on.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  # nginx <-> backend. Published to the host via nginx's port mapping only.
  # Subnet pinned (#191) so ForwardedHeaders:KnownNetworks (backend env below,
  # Program.cs) can trust exactly this network instead of all of RFC 1918.
  # The chosen /24 sits outside Docker's default address pool (the top of the
  # 172.16.0.0/12 space, consumed top-down as bridge networks are created --
  # this shared host's concurrent stacks already occupy several /16s there,
  # see docs/testing.md) and outside the handful of /24s a typical home/office
  # LAN or a nested Docker host is likely to already be using in the low
  # 192.168.0.0/16 range, so a fixed subnet is unlikely to collide with either
  # source on a shared or nested host. Only `edge` is pinned; `internal` has
  # no route out (see below) so a fixed subnet buys it nothing.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
  # backend <-> postgres. internal: true means Docker gives this network no
  # route out (no host access, no default-gateway/internet); only containers
  # attached to it can reach each other. nginx is deliberately not attached.
  internal:
    driver: bridge
    internal: true

volumes:
  # Postgres data directory.
  pgdata:
  # Downloaded/extracted VCF artifacts and offline-repo storage (see
  # vcf-docker-download's UMDS/VCSA/VKS/ContentLibrary layout). Unused by
  # the backend today; mounted now so the path convention is fixed before
  # the download jobs (M1 later slices) land.
  artifacts:
