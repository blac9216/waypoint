# Container-internal health endpoints: nginx's own Docker HEALTHCHECK and
# anything else that wants to know whether the backend is reachable through
# nginx. Deliberately plain HTTP on an unpublished port.
#
# why: docs/rationale/deploy.md#nginx-healthz-split
server {
	listen 8081;
	server_name localhost;

	# why: docs/rationale/deploy.md#nginx-dynamic-backend-resolution
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend_host backend;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location = /healthz/upstream {
		access_log off;

		# Fail fast: a readiness probe must not hang like the SSE locations do.
		proxy_connect_timeout 2s;
		proxy_send_timeout    2s;
		proxy_read_timeout    2s;

		proxy_cache     off;
		proxy_buffering off;

		proxy_pass http://$backend_host:8080/api/v1/health;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# nginx's own default error handling on a proxy failure already
		# yields 502/504 — no error_page override needed.
	}

	location / {
		return 404;
	}
}
