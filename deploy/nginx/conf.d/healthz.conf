# Container-internal health endpoint for nginx's own Docker HEALTHCHECK.
#
# Deliberately plain HTTP on a port that is never published to the host
# (see docker-compose.yml) — a healthcheck should not depend on trusting a
# self-signed dev cert. The real bring-up verification of TLS is a curl -k
# against the published 443 listener (see deploy/README.md).

server {
	listen 8081;
	server_name localhost;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location / {
		return 404;
	}
}
