# Container-internal health endpoints for nginx's own Docker HEALTHCHECK and
# for anything (operator, external monitor, future UI) that wants to know
# whether the backend is actually reachable through nginx.
#
# Deliberately plain HTTP on a port that is never published to the host
# (see compose.yaml) — a healthcheck should not depend on trusting a
# self-signed dev cert. The real bring-up verification of TLS is a curl -k
# against the published 443 listener (see deploy/README.md).
#
# --- Liveness vs. readiness (#66) -----------------------------------------
# `/healthz` is LIVENESS: "is nginx itself up," nothing more. It stays a
# local `return 200`, unchanged, and remains what the Docker Compose
# `healthcheck:` for this service polls. #66 deliberately does NOT fold
# backend reachability into this endpoint or into the container
# HEALTHCHECK: nginx would then report unhealthy every time `backend` is
# legitimately recreated (e.g. the ADR-0009 self-update flow, or ordinary
# `docker compose restart backend`), and anything that treats Docker
# HEALTHCHECK as a liveness signal (an external supervisor that bounces
# unhealthy containers, `depends_on: condition: service_healthy`) would
# then bounce or block on nginx for a problem that isn't nginx's.
#
# `/healthz/upstream` is READINESS: "is nginx AND the backend it proxies to
# both reachable." It actively proxies to the backend's own liveness
# endpoint (`GET /api/v1/health`, see HealthController) so a stopped,
# crash-looping, or network-partitioned backend is visible through nginx —
# closing the silent-outage window #66 was filed for — without changing
# what the Docker HEALTHCHECK contract means. Callers (operators, external
# monitors, a future UI status surface) choose liveness or readiness
# explicitly by which path they hit; see deploy/README.md's troubleshooting
# section for intended use of each. Per-domain runner capability (compliance
# vs. download runner) is out of scope here — that surfaces through the
# backend's own `GET /system` per #443, not through this nginx probe.
server {
	listen 8081;
	server_name localhost;

	# Same re-resolution requirement as the edge server's /api proxy (#59):
	# a literal `backend:8080` proxy_pass target is resolved once at config
	# load and cached for the worker's lifetime, so `backend` being
	# recreated with a new IP (self-update, plain restart) would otherwise
	# leave this endpoint dialling a stale address until `nginx -s reload`.
	# The fix is the same two-part pattern as default.conf: a `resolver`
	# plus a *variable* proxy_pass target, so nginx re-resolves per request.
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend_host backend;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location = /healthz/upstream {
		access_log off;

		# Short timeouts: a readiness probe must fail fast, not hang for
		# the same 3600s the SSE locations in default.conf allow. connect
		# is the dominant risk here (backend container gone/unreachable);
		# send/read cover a backend that accepted the TCP connection but
		# is wedged.
		proxy_connect_timeout 2s;
		proxy_send_timeout    2s;
		proxy_read_timeout    2s;

		# No caching or buffering of the probe result — every hit must
		# reflect the backend's current state, not a stale cached response.
		proxy_cache     off;
		proxy_buffering off;

		# $backend_host (not a literal `backend`) so this re-resolves via
		# the `resolver` above on every request — see the block comment
		# above and #59's default.conf comments for why a literal target
		# or an `upstream {}` block would silently cache a stale address.
		proxy_pass http://$backend_host:8080/api/v1/health;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# nginx's own default error handling on a proxy failure (backend
		# unreachable, connection refused, timeout) already yields 502/504
		# — no intercept_errors/error_page override needed; the point of
		# this endpoint is to surface exactly that failure, not mask it.
	}

	location / {
		return 404;
	}
}
