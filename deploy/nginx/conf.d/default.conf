# Edge nginx: TLS termination, static frontend, /api reverse proxy.

# --- Plain HTTP: redirect only ---------------------------------------------
server {
	listen 80;
	server_name localhost;

	server_tokens off;

	location / {
		return 301 https://$host$request_uri;
	}
}

# --- HTTPS: TLS termination, hardening headers, proxying -------------------
server {
	# IPv4 only: this stack's bridge networks don't guarantee IPv6.
	listen 443 ssl;
	server_name localhost;

	server_tokens off;

	# why: docs/rationale/deploy.md#nginx-tls-fail-closed
	ssl_certificate     /etc/nginx/certs/tls.crt;
	ssl_certificate_key /etc/nginx/certs/tls.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers on;

	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 10m;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=2592000" always;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "same-origin" always;

	# why: docs/rationale/deploy.md#nginx-csp-same-origin
	add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	# why: docs/rationale/deploy.md#nginx-request-method-allowlist
	if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
		return 405;
	}

	root  /usr/share/nginx/html;
	index index.html;

	# why: docs/rationale/deploy.md#nginx-dynamic-backend-resolution
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend_host backend;
	set $keycloak_host keycloak;

	# SSE endpoints: buffering must stay off or EventSource never sees an
	# event until a buffer fills.
	location ~ ^/api/v1/(events|runs/[^/]+/events)$ {
		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;

		proxy_buffering             off;
		proxy_cache                 off;
		proxy_read_timeout          3600s;
		chunked_transfer_encoding   off;
	}

	# Managed-tool upload: raise the body-size cap for this one route only.
	# why: docs/rationale/deploy.md#nginx-upload-size-override
	location = /api/v1/downloads/tool/upload {
		client_max_body_size       512m;

		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;
	}

	# Everything else under /api - ordinary REST, buffered as normal.
	location /api/ {
		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;
	}

	# Keycloak: relative path is forwarded unmodified on purpose.
	# why: docs/rationale/deploy.md#nginx-auth-relative-path-passthrough
	location /auth/ {
		proxy_pass                 http://$keycloak_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;
		proxy_set_header           X-Forwarded-Host  $host;
	}

	# --- Repo path-space: read-only stores, mode-independent, no auth yet ---
	# (#1510 adds the per-location auth toggle). The runner owns ONE store
	# root (its /vcf, mounted read-only at /srv/repo) and writes every store
	# tree inside it, so each location aliases its own distinct subtree and
	# /repo/depot/ explicitly denies the store subtrees -- a file under one
	# store never resolves through another store's location.
	# why: docs/rationale/deploy.md#nginx-repo-store-subtree-aliases
	#
	# ssl_verify_client optional;  -- reserved, deliberately absent: repo
	# paths never require the client cert app paths may eventually require.
	# why: docs/rationale/deploy.md#nginx-repo-mtls-carve-out
	#
	# Prefixed under /repo/ (not root) so a non-root SDDC Manager 9.1
	# `basePath` consumer is never assumed away.
	# why: docs/rationale/deploy.md#nginx-repo-no-root-mount

	# The store subtrees are owned by the per-store locations below and are
	# NOT reachable through the depot location. Transfer/VCSA are staging
	# trees no location serves. Regex locations are matched before the
	# prefix search settles, so this wins over `/repo/depot/`.
	# why: docs/rationale/deploy.md#nginx-repo-store-subtree-aliases
	location ~* ^/repo/depot/(UMDS|Photon|VKS|VMTools|ContentLibrary|VCSA|Transfer)(/|$) {
		return 404;
	}

	# Depot proper: the VCF artifact tree at the store root (PROD/... --
	# VCFDT distributions and the signed product-version catalog), minus
	# the store subtrees denied above. autoindex off.
	# why: docs/rationale/deploy.md#nginx-repo-umds-disable-symlinks
	location /repo/depot/ {
		alias /srv/repo/;
		include /etc/nginx/conf.d/repo-mime.types;
		disable_symlinks on;
	}

	# ESX patch store (UMDS). why: docs/rationale/deploy.md#nginx-repo-umds-disable-symlinks
	location /repo/umds/ {
		alias /srv/repo/UMDS/;
		include /etc/nginx/conf.d/repo-mime.types;
		disable_symlinks on;
	}

	# Literal lowercase root -- case-sensitive tdnf `baseurl` consumer.
	# `^~` stops nginx from falling through to the case-insensitive regex
	# location below once this prefix matches.
	# why: docs/rationale/deploy.md#nginx-repo-photon-case-sensitive-root
	location ^~ /photon/ {
		alias /srv/repo/Photon/;
		include /etc/nginx/conf.d/repo-mime.types;
		disable_symlinks on;
	}

	# Any non-lowercase variant (case-insensitive regex) must not silently
	# fall through to the SPA catch-all below. Regex locations are matched
	# before the length-ranked prefix search, but the `^~` on /photon/
	# above short-circuits that search for the literal lowercase form
	# before regex matching is even considered, so it still wins.
	# why: docs/rationale/deploy.md#nginx-repo-photon-case-sensitive-root
	location ~* ^/photon/ {
		return 404;
	}

	location /repo/vmtools/ {
		alias /srv/repo/VMTools/;
		include /etc/nginx/conf.d/repo-mime.types;
		disable_symlinks on;
	}

	# VCSP-style: consumer needs directory listing.
	location /repo/vks/ {
		alias /srv/repo/VKS/;
		include /etc/nginx/conf.d/repo-mime.types;
		autoindex on;
		disable_symlinks on;
	}

	# VCSP-style: vCenter subscribed-library browsing needs directory
	# listing. No index.v3/bundles indexing here -- that's VCF 5.x-only.
	location /repo/content-libraries/ {
		alias /srv/repo/ContentLibrary/;
		include /etc/nginx/conf.d/repo-mime.types;
		autoindex on;
		disable_symlinks on;
	}

	# Static frontend bundle (React + TS PWA), from ../frontend/dist.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
