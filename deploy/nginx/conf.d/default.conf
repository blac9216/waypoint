# Edge nginx: TLS termination, static frontend, /api reverse proxy.
# See ADR-0001 (packaging), ADR-0003 (reverse proxy) and docs/architecture.md
# (component view).
#
# Dev-only certs: run deploy/nginx/certs/generate-dev-certs.sh first.
# In production the operator supplies real certs from their internal CA.
#
# --- Hardening baseline (issue #52, DISA/CIS nginx guidance) -------------
# ADR-0003 picked nginx partly because DISA publishes hardening guidance for
# it; this file is where that guidance gets applied, so it is exercised on
# every bring-up rather than bolted on at packaging time. Baseline vs.
# operator-tunable directives are called out below and in deploy/README.md.

# Plain HTTP is redirected, not refused. No ACME/external redirect target -
# this is a static same-host redirect, air-gap-safe. Deliberately its own
# `server` block (not a `return` bolted onto the TLS block) so it never
# shares `ssl_*` state with the HTTPS server below.
server {
	listen 80;
	server_name localhost;

	server_tokens off;

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	# IPv4 only: the compose bridge networks here don't guarantee IPv6, and
	# `listen [::]:443` makes nginx refuse to start at all when the
	# container's network stack has no IPv6 (observed in CI/sandbox
	# environments and not uncommon on hardened hosts either).
	listen 443 ssl;
	server_name localhost;

	# Don't advertise the nginx version in the `Server` response header or
	# on generated error pages (DISA/CIS: information disclosure).
	server_tokens off;

	ssl_certificate     /etc/nginx/certs/dev-cert.pem;
	ssl_certificate_key /etc/nginx/certs/dev-key.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;

	# Explicit modern cipher policy rather than relying on nginx's compiled-in
	# default list (DISA/CIS: don't inherit an implicit cipher suite). Server
	# preference order matters because we set it below. This list is
	# TLSv1.2-compatible (ECDHE + AES-GCM/CHACHA20, all AEAD, no CBC/RC4/3DES)
	# - TLSv1.3 negotiates its own fixed AEAD suite set regardless of
	# `ssl_ciphers`, so nothing further is needed for that protocol version.
	ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers on;

	# Session resumption tuned for a single-appliance deployment: a modest
	# in-memory cache (no ssl_session_tickets, which would need out-of-band
	# key rotation this appliance doesn't yet implement - see the residual
	# note in the PR description) and a session lifetime that doesn't
	# outlive a reasonable operator session.
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 10m;
	ssl_session_tickets off;

	# HSTS: safe to set unconditionally because this server block is
	# HTTPS-only and the plain-HTTP block above only ever redirects here -
	# there is no legitimate same-host plain-HTTP destination to pin away
	# from. max-age is 30 days rather than the commonly-recommended 1-2
	# years: this is an operator-administered appliance reached by IP/local
	# hostname (not a public domain with a long-lived cert-rotation cadence
	# operators coordinate against), so a shorter pin bounds the blast radius
	# of a botched cert rotation without meaningfully weakening the control.
	# `always` so it is also sent on error responses. No `preload` - that's
	# a public-suitelist mechanism, meaningless for an internal appliance
	# hostname.
	add_header Strict-Transport-Security "max-age=2592000" always;

	# MIME-sniffing / framing / referrer hardening. frame-ancestors in the
	# CSP below is the modern equivalent of X-Frame-Options and takes
	# precedence in CSP-aware browsers; X-Frame-Options is kept alongside it
	# for older UAs that ignore CSP entirely (belt-and-suspenders, standard
	# DISA/CIS guidance).
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "same-origin" always;

	# Content-Security-Policy: the PWA (ADR-0007) is a zero-external-asset
	# bundle - Vite emits linked <link>/<script> tags and CSS files, no
	# inline <style>/<script>, no CDN fonts/images (verified against
	# frontend/index.html and vite.config.ts at authoring time: no
	# styled-components/emotion CSS-in-JS, no inline `style=` attributes).
	# `default-src 'self'` therefore covers scripts, styles, images, and
	# fonts without any 'unsafe-inline'/'unsafe-eval' relaxation.
	# `connect-src 'self'` covers both the ordinary /api/ REST calls and the
	# /api/v1/events SSE endpoints - EventSource and fetch/XHR are both
	# governed by connect-src, and both stay same-origin through this proxy,
	# so no additional origin is needed here. `frame-ancestors 'none'` is
	# the CSP-native form of the X-Frame-Options DENY above. `base-uri` and
	# `form-action` are pinned to 'self' as standard defense-in-depth beyond
	# what default-src alone implies. If a future screen needs an inline
	# style/script or a non-same-origin connection, this line needs to
	# change with it - don't silently relax it elsewhere.
	add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

	# Request-method allowlist (issue #388, DISA/CIS guidance: reject methods
	# the app never serves, e.g. TRACE/CONNECT). Deferred out of #52/#387
	# pending a stable REST surface and a live stack to verify against
	# (docs/api-contract.md) - both are now in place.
	#
	# Allowed set: GET, HEAD, POST, PUT, DELETE, OPTIONS. Derived from
	# docs/api-contract.md's full resource table: every documented route uses
	# GET/POST/PUT/DELETE (no PATCH anywhere in the contract - don't add it
	# speculatively). HEAD is included because it's implied by every GET
	# handler in HTTP/1.1 (the frontend's static-file serving and nginx's own
	# `try_files` both rely on this implicitly) and costs nothing to allow
	# explicitly. OPTIONS is included even though this is a same-origin
	# deployment with no CORS preflight in play today: a same-origin `fetch`
	# can still legitimately preflight (e.g. a future request carrying a
	# non-simple header), and OPTIONS reaching the backend as a 404/405 is a
	# normal, harmless outcome - excluding it at the edge would fail closed
	# on a case HTTP itself considers ordinary. Nothing else appears anywhere
	# in the contract, so everything else - TRACE, CONNECT, PROPFIND, and any
	# other WebDAV/exotic verb - is rejected.
	#
	# Mechanism: a single `if ($request_method !~ ...) { return 405; }` at
	# server level, not `limit_except` per location. `limit_except` only
	# constrains directives *inside* the location it wraps and has to be
	# repeated (and kept in sync) in every `location` block in this file
	# (SSE, /api/, static) - the exact kind of drift-prone duplication this
	# file's other comments already warn against. nginx's own "if is evil"
	# guidance (http://nginx.org/en/docs/http/ngx_http_rewrite_module.html#if)
	# calls out `return` as one of the two directives that are safe inside an
	# `if` in this context (the other being `rewrite ... last`) - so a
	# return-only `if` at server level, evaluated once per request before any
	# location is chosen, is the standard, sanctioned pattern for exactly
	# this case. Placed before `root`/`location` so it applies uniformly to
	# every path this server block serves, including the SSE and /api/
	# locations below.
	if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
		return 405;
	}

	root  /usr/share/nginx/html;
	index index.html;

	# --- Re-resolve `backend` per request (#59) ---------------------------
	# A *literal* proxy_pass target (e.g. `proxy_pass http://backend:8080;`)
	# is resolved by nginx exactly once, at config load, and the resulting
	# IP is cached for the life of the worker process — OSS nginx has no
	# re-resolution for a statically-configured target. Recreate the
	# `backend` container (new IP on the `edge` bridge network — exactly
	# what the ADR-0009 self-update flow does, and what swapping the
	# backend stub for the real backend (#3) will do once) and nginx keeps
	# dialling the stale address: every route 502s until `nginx -s reload`.
	#
	# The fix is two directives working together:
	#   1. `resolver` below, so nginx has somewhere to ask.
	#   2. Every proxy_pass target contains the $backend_host *variable*
	#      (never the literal `backend` host name), so nginx treats it as
	#      dynamic and re-resolves it — honouring `valid=` — on every
	#      request, instead of caching a single lookup forever.
	# Do not "simplify" either proxy_pass back to a literal `backend:8080`
	# — that silently reintroduces this bug. An explicit
	# `upstream backend { server backend:8080; }` block is not a fix
	# either: it is just as literal and caches at load time exactly the
	# same way; re-resolving `server ... resolve;` inside `upstream` is an
	# nginx **Plus** feature this stack doesn't have.
	#
	# 127.0.0.11 is Docker's embedded DNS server: every container on a
	# user-defined bridge network (like `edge`) gets it in /etc/resolv.conf,
	# and it resolves service/container names to whatever IP that name
	# currently has — which is exactly the per-request lookup this needs.
	# This address is Docker-specific and only valid inside a Docker
	# network namespace; a non-Docker deployment (e.g. a future Packer OVA
	# per ADR-0001 running services under systemd instead of Docker) has no
	# 127.0.0.11 to ask and would need this pointed at that host's real
	# resolver (or the topology would need static addressing instead).
	# `ipv6=off` matches the IPv4-only reasoning already established above
	# for `listen` — this stack's bridge networks don't guarantee IPv6.
	# `valid=10s` bounds how long a resolution is trusted before the next
	# request re-asks, independent of whatever TTL Docker's DNS returns.
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend_host backend;

	# SSE endpoints (docs/api-contract.md "Event streams (SSE)":
	# /api/v1/events and /api/v1/runs/{id}/events). ADR-0003 requires
	# proxy_buffering off here — otherwise nginx holds the response until
	# it fills a buffer or the upstream closes, and the browser's
	# EventSource never sees an event until then.
	#
	# proxy_pass is given with NO URI part here (see #51): in a regex
	# location this forwards the original request URI unchanged (path +
	# query string) with no re-normalization. Unlike #58's literal
	# `http://backend:8080`, the target now carries the $backend_host
	# variable (see the re-resolution block above) so this location
	# resolves `backend` itself, per request, via `resolver` — it does not
	# depend on the sibling `location /api/` block below declaring a
	# matching implicit upstream (that was #51's original trap, and #58's
	# literal form was *also* only correct because nothing else in the file
	# forced runtime resolution; #59 needed runtime resolution back, so it
	# returns via the variable route, deliberately and with a resolver this
	# time, not by accident). Do not add a URI part here.
	location ~ ^/api/v1/(events|runs/[^/]+/events)$ {
		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;

		proxy_buffering             off;
		proxy_cache                 off;
		proxy_read_timeout          3600s;
		chunked_transfer_encoding   off;
	}

	# Everything else under /api - ordinary REST, buffered as normal.
	#
	# Also given with NO URI part, for the same re-resolution reason as the
	# SSE location above: the target must carry $backend_host, not the
	# literal host name, or this block would go back to caching the
	# backend's address at config load and reintroduce #59.
	#
	# That said, dropping the URI part is NOT a no-op (#73). On the
	# path-prefix axis it is an identity transform (`/api/` -> `/api/` is
	# what the previous `.../api/;` suffix already did). But `proxy_pass`
	# *with* a URI part sends nginx's normalized/decoded request URI, while
	# `proxy_pass` *without* one (this form) forwards the client's raw
	# request URI unchanged. Concretely: `%2F` in the URI used to be
	# decoded into a literal `/` before reaching the backend; now it is
	# preserved as `%2F`. That is the correct behaviour for `{id}` path
	# segments that can legitimately contain an encoded separator, and it
	# is also required here - a variable-bearing `proxy_pass` cannot carry
	# a URI part without truncating every request to a bare `/api/` (see
	# #73) - but a reader relying on "identical to before" for the whole
	# REST surface, not just the path prefix, would be wrong.
	location /api/ {
		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;
	}

	# Static frontend bundle (React + TS PWA). Bind-mounted from
	# ../frontend/dist (see docker-compose.yml) - the real Vite build
	# output, not a placeholder. Run `npm run build` in frontend/ first.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
