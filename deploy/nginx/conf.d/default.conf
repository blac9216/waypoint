# Edge nginx: TLS termination, static frontend, /api reverse proxy.
# See ADR-0001 (packaging), ADR-0003 (reverse proxy) and docs/architecture.md
# (component view).
#
# Dev-only certs: run deploy/nginx/certs/generate-dev-certs.sh first.
# In production the operator supplies real certs from their internal CA.

server {
	# IPv4 only: the compose bridge networks here don't guarantee IPv6, and
	# `listen [::]:443` makes nginx refuse to start at all when the
	# container's network stack has no IPv6 (observed in CI/sandbox
	# environments and not uncommon on hardened hosts either).
	listen 443 ssl;
	server_name localhost;

	ssl_certificate     /etc/nginx/certs/dev-cert.pem;
	ssl_certificate_key /etc/nginx/certs/dev-key.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;

	root  /usr/share/nginx/html;
	index index.html;

	# --- Re-resolve `backend` per request (#59) ---------------------------
	# A *literal* proxy_pass target (e.g. `proxy_pass http://backend:8080;`)
	# is resolved by nginx exactly once, at config load, and the resulting
	# IP is cached for the life of the worker process — OSS nginx has no
	# re-resolution for a statically-configured target. Recreate the
	# `backend` container (new IP on the `edge` bridge network — exactly
	# what the ADR-0009 self-update flow does, and what swapping the
	# backend stub for the real backend (#3) will do once) and nginx keeps
	# dialling the stale address: every route 502s until `nginx -s reload`.
	#
	# The fix is two directives working together:
	#   1. `resolver` below, so nginx has somewhere to ask.
	#   2. Every proxy_pass target contains the $backend_host *variable*
	#      (never the literal `backend` host name), so nginx treats it as
	#      dynamic and re-resolves it — honouring `valid=` — on every
	#      request, instead of caching a single lookup forever.
	# Do not "simplify" either proxy_pass back to a literal `backend:8080`
	# — that silently reintroduces this bug. An explicit
	# `upstream backend { server backend:8080; }` block is not a fix
	# either: it is just as literal and caches at load time exactly the
	# same way; re-resolving `server ... resolve;` inside `upstream` is an
	# nginx **Plus** feature this stack doesn't have.
	#
	# 127.0.0.11 is Docker's embedded DNS server: every container on a
	# user-defined bridge network (like `edge`) gets it in /etc/resolv.conf,
	# and it resolves service/container names to whatever IP that name
	# currently has — which is exactly the per-request lookup this needs.
	# This address is Docker-specific and only valid inside a Docker
	# network namespace; a non-Docker deployment (e.g. a future Packer OVA
	# per ADR-0001 running services under systemd instead of Docker) has no
	# 127.0.0.11 to ask and would need this pointed at that host's real
	# resolver (or the topology would need static addressing instead).
	# `ipv6=off` matches the IPv4-only reasoning already established above
	# for `listen` — this stack's bridge networks don't guarantee IPv6.
	# `valid=10s` bounds how long a resolution is trusted before the next
	# request re-asks, independent of whatever TTL Docker's DNS returns.
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend_host backend;

	# SSE endpoints (docs/api-contract.md "Event streams (SSE)":
	# /api/v1/events and /api/v1/runs/{id}/events). ADR-0003 requires
	# proxy_buffering off here — otherwise nginx holds the response until
	# it fills a buffer or the upstream closes, and the browser's
	# EventSource never sees an event until then.
	#
	# proxy_pass is given with NO URI part here (see #51): in a regex
	# location this forwards the original request URI unchanged (path +
	# query string) with no re-normalization. Unlike #58's literal
	# `http://backend:8080`, the target now carries the $backend_host
	# variable (see the re-resolution block above) so this location
	# resolves `backend` itself, per request, via `resolver` — it does not
	# depend on the sibling `location /api/` block below declaring a
	# matching implicit upstream (that was #51's original trap, and #58's
	# literal form was *also* only correct because nothing else in the file
	# forced runtime resolution; #59 needed runtime resolution back, so it
	# returns via the variable route, deliberately and with a resolver this
	# time, not by accident). Do not add a URI part here.
	location ~ ^/api/v1/(events|runs/[^/]+/events)$ {
		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;

		proxy_buffering             off;
		proxy_cache                 off;
		proxy_read_timeout          3600s;
		chunked_transfer_encoding   off;
	}

	# Everything else under /api - ordinary REST, buffered as normal.
	#
	# Also given with NO URI part, for the same re-resolution reason as the
	# SSE location above: the target must carry $backend_host, not the
	# literal host name, or this block would go back to caching the
	# backend's address at config load and reintroduce #59.
	#
	# That said, dropping the URI part is NOT a no-op (#73). On the
	# path-prefix axis it is an identity transform (`/api/` -> `/api/` is
	# what the previous `.../api/;` suffix already did). But `proxy_pass`
	# *with* a URI part sends nginx's normalized/decoded request URI, while
	# `proxy_pass` *without* one (this form) forwards the client's raw
	# request URI unchanged. Concretely: `%2F` in the URI used to be
	# decoded into a literal `/` before reaching the backend; now it is
	# preserved as `%2F`. That is the correct behaviour for `{id}` path
	# segments that can legitimately contain an encoded separator, and it
	# is also required here - a variable-bearing `proxy_pass` cannot carry
	# a URI part without truncating every request to a bare `/api/` (see
	# #73) - but a reader relying on "identical to before" for the whole
	# REST surface, not just the path prefix, would be wrong.
	location /api/ {
		proxy_pass                 http://$backend_host:8080;
		proxy_http_version         1.1;
		proxy_set_header           Host              $host;
		proxy_set_header           X-Real-IP         $remote_addr;
		proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header           X-Forwarded-Proto $scheme;
	}

	# Static frontend bundle (React + TS PWA). Bind-mounted from
	# ../frontend/dist (see docker-compose.yml) - the real Vite build
	# output, not a placeholder. Run `npm run build` in frontend/ first.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
