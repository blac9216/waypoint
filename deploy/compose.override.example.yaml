# Development-only overlay for compose.yaml. Copy to compose.override.yaml
# (gitignored) to opt in — Compose auto-loads it:
#   cp compose.override.example.yaml compose.override.yaml && docker compose up -d
# Never rename/copy to compose.yaml. See deploy/README.md and
# docs/rationale/deploy.md.
#
# dev-bootstrap and keycloak-dev-admin need
# ./config/secrets/dev-admin-password (see deploy/README.md).

services:
  # --- dev-bootstrap ---
  # why: docs/rationale/deploy.md#override-dev-bootstrap-local-auth-design
  dev-bootstrap:
    build:
      context: ./dev-bootstrap
    volumes:
      - dev-secrets:/run/waypoint-dev-secrets
      - dev-tls:/run/waypoint-dev-tls
      - compliance-profiles:/opt/waypoint/profiles
    network_mode: none
    restart: "no"

  # --- dev-auth-bootstrap ---
  dev-auth-bootstrap:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /run/waypoint-dev-secrets/local-auth-admin-password-hash ]; then
          printf '%s\n' "$$WAYPOINT_DEV_PASSWORD" \
            | dotnet Waypoint.Api.dll --hash-password \
            > /run/waypoint-dev-secrets/local-auth-admin-password-hash.tmp
          mv /run/waypoint-dev-secrets/local-auth-admin-password-hash.tmp \
            /run/waypoint-dev-secrets/local-auth-admin-password-hash
          chown 1654:1654 /run/waypoint-dev-secrets/local-auth-admin-password-hash
          chmod 600 /run/waypoint-dev-secrets/local-auth-admin-password-hash
        fi
    environment:
      WAYPOINT_DEV_PASSWORD: "${WAYPOINT_DEV_PASSWORD:-waypoint-dev}"
    volumes:
      - dev-secrets:/run/waypoint-dev-secrets
    network_mode: none
    restart: "no"

  # --- keycloak-dev-admin ---
  # Provisions a real Waypoint-realm login user, distinct from Keycloak's own
  # master-realm bootstrap admin. Idempotent: reconciles password/group on
  # every run.
  # why: docs/rationale/deploy.md#override-dev-admin-idempotent-provisioning
  keycloak-dev-admin:
    build:
      context: ./keycloak-dev-admin
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      WAYPOINT_DEV_ADMIN_USERNAME: "${WAYPOINT_DEV_ADMIN_USERNAME:-developer}"
      WAYPOINT_KEYCLOAK_INTERNAL_URL: "http://keycloak:8080/auth"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
    volumes:
      - type: bind
        source: ./config/secrets/dev-admin-password
        target: /run/secrets/dev-admin-password
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - keycloak-bootstrap-admin-password
    networks:
      - internal
    restart: "no"

  nginx:
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    # Compose merges `volumes:` by target — these replace the base's mandatory
    # bind mounts with subpaths of the generated dev-tls volume.
    # why: docs/rationale/deploy.md#override-volume-subpath-replacement
    volumes:
      - type: volume
        source: dev-tls
        target: /etc/nginx/certs/tls.crt
        read_only: true
        volume:
          subpath: tls.crt
      - type: volume
        source: dev-tls
        target: /etc/nginx/certs/tls.key
        read_only: true
        volume:
          subpath: tls.key

  backend:
    depends_on:
      dev-auth-bootstrap:
        condition: service_completed_successfully
    environment:
      # Dev-grade local auth — never set on a real deployment.
      # why: docs/rationale/deploy.md#override-dev-bootstrap-local-auth-design
      LocalAuth__AdminPasswordHashFile: "/run/secrets/local-auth-admin-password-hash"
      LocalAuth__AdminPasswordHash: "${WAYPOINT_ADMIN_PASSWORD_HASH:-}"
      LocalAuth__Enabled: "${LOCAL_AUTH_ENABLED:-true}"
      # why: docs/rationale/deploy.md#override-public-url-localhost-default
      Oidc__PublicUrl: "${WAYPOINT_PUBLIC_URL:-https://localhost:${WAYPOINT_HTTPS_PORT:-8443}}"
    volumes:
      - dev-secrets:/run/secrets:ro

  keycloak:
    environment:
      # Same localhost default as backend's Oidc__PublicUrl — must stay equal.
      # why: docs/rationale/deploy.md#override-public-url-localhost-default
      WAYPOINT_PUBLIC_URL: "${WAYPOINT_PUBLIC_URL:-https://localhost:${WAYPOINT_HTTPS_PORT:-8443}}"
      KC_HOSTNAME: "${WAYPOINT_PUBLIC_URL:-https://localhost:${WAYPOINT_HTTPS_PORT:-8443}}/auth"

  compliance-runner:
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    environment:
      # Dev-picked conservative sizing; see RunnerResourceOptions' default.
      RunnerResources__FallbackCpuCores: "${RUNNER_FALLBACK_CPU_CORES:-4}"
      RunnerResources__FallbackMemoryBytes: "${RUNNER_FALLBACK_MEMORY_BYTES:-4294967296}"
    volumes:
      - dev-secrets:/run/secrets:ro

  download-runner:
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    volumes:
      - dev-secrets:/run/secrets:ro

volumes:
  # Generated dev-only master key + local-auth hash; `down -v` resets them.
  dev-secrets:
  # Generated dev-only self-signed nginx certificate/key.
  dev-tls:
