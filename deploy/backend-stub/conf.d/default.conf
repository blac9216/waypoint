server {
	listen 8080;
	server_name localhost;
	default_type application/json;

	location = /api/v1/health {
		return 200 '{"status":"ok","service":"backend-stub"}';
	}

	location /api/ {
		return 501 '{"error":"not_implemented","message":"backend service is a placeholder - see issue #3"}';
	}

	location / {
		return 404 '{"error":"not_found"}';
	}
}
