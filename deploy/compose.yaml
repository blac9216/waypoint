# Waypoint production compose base: Keycloak-only auth, operator-provided
# TLS/secrets, no dev bootstrap. For local dev, copy
# compose.override.example.yaml to compose.override.yaml. See
# deploy/README.md and docs/rationale/deploy.md.
# why: docs/rationale/deploy.md#compose-name-waypoint-project-identity
name: waypoint

# ── Operator-editable configuration ─────────────────────────────────────
x-operator-config:
  # Browser-facing HTTPS origin; derives the backend's OIDC issuer and
  # Keycloak's own hostname. REQUIRED for a real deployment.
  # why: docs/rationale/deploy.md#compose-public-url-single-origin
  public-url: &public-url "${WAYPOINT_PUBLIC_URL:-https://waypoint.example.internal}"
  # Host port nginx's TLS listener publishes to.
  https-port: &https-port "${WAYPOINT_HTTPS_PORT:-8443}"
  # Subnet for the `edge` network (nginx <-> backend/keycloak).
  # why: docs/rationale/deploy.md#compose-edge-subnet-pinning
  edge-subnet: &edge-subnet "${WAYPOINT_EDGE_SUBNET:-192.168.240.0/24}"
  # Operator-provided TLS certificate/key. REQUIRED.
  # why: docs/rationale/deploy.md#compose-tls-required-no-fallback
  tls-cert-file: &tls-cert-file ./config/tls/tls.crt
  tls-key-file: &tls-key-file ./config/tls/tls.key

x-backend-image: &backend-image
  build:
    context: ..
    dockerfile: backend/Dockerfile

services:
  # --- nginx ---
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    # Long syntax: published: aliases https-port.
    # why: docs/rationale/deploy.md#compose-ports-long-syntax
    ports:
      - target: 443
        published: *https-port
    volumes:
      # Place real cert/key at deploy/config/tls/tls.{crt,key} (gitignored).
      # why: docs/rationale/deploy.md#compose-tls-bind-fail-closed
      - type: bind
        source: *tls-cert-file
        target: /etc/nginx/certs/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: *tls-key-file
        target: /etc/nginx/certs/tls.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --- backend ---
  backend:
    <<: *backend-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # No LocalAuth__* here — Keycloak-only. See compose.override.example.yaml.
      Oidc__Authority: "${OIDC_AUTHORITY:-http://keycloak:8080/auth/realms/waypoint}"
      # why: docs/rationale/deploy.md#compose-public-url-single-origin
      Oidc__PublicUrl: *public-url
      Oidc__Audience: "${OIDC_AUDIENCE:-waypoint-backend}"
      Oidc__RequireHttpsMetadata: "${OIDC_REQUIRE_HTTPS_METADATA:-false}"
      # Browser-facing authority/client id — deliberately not Oidc__Authority.
      # why: docs/rationale/deploy.md#compose-oidc-authority-vs-public-authority
      Oidc__PublicAuthority: "${OIDC_PUBLIC_AUTHORITY:-/auth/realms/waypoint}"
      Oidc__PublicClientId: "${OIDC_PUBLIC_CLIENT_ID:-waypoint-frontend}"
      # why: docs/rationale/deploy.md#compose-db-passwordfile-split
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=${POSTGRES_USER:-waypoint};Password="
      Database__PasswordFile: "${WAYPOINT_DB_PASSWORD_FILE:-/run/db-secret/postgres-owner-password}"
      ForwardedHeaders__KnownNetworks__0: *edge-subnet
      # why: docs/rationale/deploy.md#compose-master-key-file-only
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
    volumes:
      # why: docs/rationale/deploy.md#compose-backend-artifact-mount-scope
      - artifacts:/var/lib/waypoint/artifacts:ro
      # why: docs/rationale/deploy.md#compose-tool-upload-staging-volume
      - tool-upload-staging:/var/lib/waypoint/tool-upload-staging
      # Mount SHAPE to copy into compose.override.yaml — do not uncomment here.
      # why: docs/rationale/deploy.md#compose-master-key-override-not-uncomment
      # - type: bind
      #   source: ./config/secrets/waypoint-master-key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    # why: docs/rationale/deploy.md#compose-db-secret-vs-run-secrets-split
    secrets:
      - source: postgres-owner-password
        target: /run/db-secret/postgres-owner-password
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # --- postgres ---
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-owner-password
      POSTGRES_COMPLIANCE_RUNNER_PASSWORD_FILE: /run/secrets/postgres-compliance-runner-password
      POSTGRES_DOWNLOAD_RUNNER_PASSWORD_FILE: /run/secrets/postgres-download-runner-password
      POSTGRES_KEYCLOAK_PASSWORD_FILE: /run/secrets/postgres-keycloak-password
    secrets:
      - postgres-owner-password
      - postgres-compliance-runner-password
      - postgres-download-runner-password
      - postgres-keycloak-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports: — reachable only on `internal`, never published to the host.
    networks:
      - internal
    healthcheck:
      # why: docs/rationale/deploy.md#compose-postgres-healthcheck-wrapper
      test: ["CMD", "/usr/local/bin/waypoint-postgres-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # --- keycloak ---
  keycloak:
    build:
      context: ./keycloak
    # why: docs/rationale/deploy.md#compose-keycloak-hostname-strict
    command: ["start-dev", "--import-realm", "--http-enabled=true", "--hostname-strict=true", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/postgres-keycloak-password
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak-bootstrap-admin-password
      WAYPOINT_BACKEND_CLIENT_SECRET_FILE: /run/secrets/keycloak-backend-client-secret
      # start-dev HTTP is fine — TLS terminates once, at nginx.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # why: docs/rationale/deploy.md#compose-public-url-single-origin
      WAYPOINT_PUBLIC_URL: *public-url
      # why: docs/rationale/deploy.md#compose-realm-placeholder-substitution
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      # why: docs/rationale/deploy.md#compose-keycloak-hostname-strict
      KC_HOSTNAME: "${WAYPOINT_PUBLIC_URL:-https://waypoint.example.internal}/auth"
      # why: docs/rationale/deploy.md#compose-keycloak-relative-path
      KC_HTTP_RELATIVE_PATH: "/auth"
    secrets:
      - postgres-keycloak-password
      - keycloak-bootstrap-admin-password
      - keycloak-backend-client-secret
    networks:
      - edge
      - internal
    # No published ports — reachable only via nginx's proxy path.
    healthcheck:
      # why: docs/rationale/deploy.md#compose-keycloak-relative-path
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  # --- compliance-runner ---
  # One replica by default.
  # why: docs/rationale/deploy.md#compose-replica-scaling
  compliance-runner:
    build:
      context: ..
      dockerfile: runners/compliance-runner/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=waypoint_compliance_runner;Password="
      Database__PasswordFile: "${WAYPOINT_COMPLIANCE_DB_PASSWORD_FILE:-/run/db-secret/postgres-compliance-runner-password}"
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
      # why: docs/rationale/deploy.md#compose-module-preload-order
      PowerShell__ModulePreloadPaths__0: "/app/PowerShell/Modules/WaypointLogging"
      PowerShell__ModulePreloadPaths__1: "/app/PowerShell/Modules/WaypointDiscovery"
      PowerShell__ModulePreloadPaths__2: "/app/PowerShell/Modules/WaypointScan"
      PowerShell__ModulePreloadPaths__3: "/app/PowerShell/Modules/WaypointCredentialTest"
      PowerShell__ModulePreloadPaths__4: "/app/PowerShell/Modules/WaypointComplianceContent"
      PowerShell__ModulePreloadNames__0: "VMware.PowerCLI"
      WAYPOINT_VMWARE_STIG_DOCKER_TRANSPORT_PATH: "/powershell/module.transport.vmware.ps1"
      WAYPOINT_VMWARE_STIG_DOCKER_NSXAPI_PATH: "/powershell/module.transport.nsxapi.ps1"
      WAYPOINT_VMWARE_STIG_DOCKER_COMMON_PATH: "/powershell/module.common.ps1"
    volumes:
      # DEPRECATED transitional fallback — see ScanJobHandler.ResolveProfilePath.
      - compliance-profiles:/opt/waypoint/profiles:ro
      - artifacts:/var/lib/waypoint/artifacts
      - compliance-content:/var/lib/waypoint/compliance-content
      # Mount SHAPE to copy into compose.override.yaml — do not uncomment here.
      # why: docs/rationale/deploy.md#compose-master-key-override-not-uncomment
      # - type: bind
      #   source: ./config/secrets/waypoint-master-key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    # why: docs/rationale/deploy.md#compose-db-secret-vs-run-secrets-split
    secrets:
      - source: postgres-compliance-runner-password
        target: /run/db-secret/postgres-compliance-runner-password
    networks:
      - internal
      - runner-egress
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.ComplianceRunner.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- download-runner ---
  # One replica by default.
  # why: docs/rationale/deploy.md#compose-replica-scaling
  download-runner:
    build:
      context: ..
      dockerfile: runners/download-runner/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Waypoint: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-waypoint};Username=waypoint_download_runner;Password="
      Database__PasswordFile: "${WAYPOINT_DOWNLOAD_DB_PASSWORD_FILE:-/run/db-secret/postgres-download-runner-password}"
      WAYPOINT_MASTER_KEY_FILE: "/run/secrets/waypoint-master-key"
      PowerShell__ModulePreloadPaths__0: "/app/PowerShell/Modules/WaypointCatalogIndex"
      PowerShell__ModulePreloadPaths__1: "/app/PowerShell/Modules/WaypointDownload"
      WAYPOINT_VCF_DOWNLOAD_MANAGER_COMMON_PATH: "/app/PowerShell/project/vcf-download-manager.common.ps1"
    volumes:
      - depot:/vcf
      - artifacts:/var/lib/waypoint/artifacts
      - managed-tool:/var/lib/waypoint/managed-tool
      # why: docs/rationale/deploy.md#compose-tool-upload-staging-volume
      - tool-upload-staging:/var/lib/waypoint/tool-upload-staging
      # Mount SHAPE to copy into compose.override.yaml — do not uncomment here.
      # why: docs/rationale/deploy.md#compose-master-key-override-not-uncomment
      # - type: bind
      #   source: ./config/secrets/waypoint-master-key
      #   target: /run/secrets/waypoint-master-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    # why: docs/rationale/deploy.md#compose-db-secret-vs-run-secrets-split
    secrets:
      - source: postgres-download-runner-password
        target: /run/db-secret/postgres-download-runner-password
    networks:
      - internal
      - runner-egress
    healthcheck:
      test: ["CMD", "dotnet", "Waypoint.DownloadRunner.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  # nginx <-> backend/keycloak. Published to the host via nginx's port mapping.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: *edge-subnet
  # backend, compliance-runner, download-runner <-> postgres. No route out.
  internal:
    driver: bridge
    internal: true
  # compliance-runner, download-runner <-> lab/target infra and the internet.
  # why: docs/rationale/deploy.md#compose-runner-egress-topology
  runner-egress:
    driver: bridge

# why: docs/rationale/deploy.md#compose-secrets-fail-closed
secrets:
  postgres-owner-password:
    file: ./config/secrets/postgres-owner-password
  postgres-compliance-runner-password:
    file: ./config/secrets/postgres-compliance-runner-password
  postgres-download-runner-password:
    file: ./config/secrets/postgres-download-runner-password
  postgres-keycloak-password:
    file: ./config/secrets/postgres-keycloak-password
  keycloak-bootstrap-admin-password:
    file: ./config/secrets/keycloak-bootstrap-admin-password
  keycloak-backend-client-secret:
    file: ./config/secrets/keycloak-backend-client-secret

volumes:
  # No dev-secrets/dev-tls here — see compose.override.example.yaml.
  pgdata:
  artifacts:
  depot:
  managed-tool:
  # why: docs/rationale/deploy.md#compose-tool-upload-staging-volume
  tool-upload-staging:
  compliance-profiles:
  compliance-content:
