name: deploy

# Always-report pattern (issue #232): see backend.yml's header for the full
# rationale. A `changes` job decides whether deploy-relevant paths changed;
# the real `deploy` job is gated on that output, and `deploy-gate` — the job
# that owns the required check-run name `compose config, nginx -t,
# shellcheck` — always runs (`if: always()`, so a cancelled run fails the
# gate instead of skipping it, since a skipped job would report Success to
# a required check) and reports success only when BOTH `changes` succeeded
# AND the real job succeeded or was skipped, failure otherwise (a
# `changes` failure would otherwise look exactly like an off-path skip).
#
# This validates the shipped compose/nginx configuration statically — it
# does NOT bring the stack up (no depot token, no dev/local/ material is
# available in CI, and the full compose bring-up is out of scope for this
# PR per the issue's "stack" job — see docs/testing.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # On pull_request events dorny/paths-filter calls the GitHub API (needs
  # `pull-requests: read`, no checkout depth required); on push-to-main it
  # walks git history against `github.event.before` instead, which needs
  # that commit present locally, hence `fetch-depth: 0` only for the push
  # case (a shallow checkout is enough — and cheaper — on pull_request).
  # The condition is written on `pull_request` rather than on `push`
  # deliberately: GitHub coerces `0` to false in expressions, so
  # `event_name == 'push' && 0 || 1` would yield 1 on every event. With
  # `event_name == 'pull_request' && 1 || 0` the chosen value is truthy on
  # the pull_request branch and is the `||` fallback on the push branch, so
  # each event actually gets the depth it needs.
  changes:
    name: "changes: deploy"
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            deploy:
              - "deploy/**"
              - "scripts/**"
              - ".github/workflows/deploy.yml"

  deploy:
    name: "compose config, nginx -t, shellcheck (job)"
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: docker compose config validates
        working-directory: deploy
        run: docker compose config

      # nginx -t needs a cert/key pair to load the TLS server block (dev
      # certs are git-ignored, generated at bring-up time — see
      # deploy/README.md). Generate a throwaway pair, exactly the way a
      # real dev bring-up would, then discard it; nothing here is reused
      # or committed.
      - name: Generate throwaway dev TLS cert for the syntax check
        run: deploy/nginx/certs/generate-dev-certs.sh

      - name: nginx -t against the shipped config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "${{ github.workspace }}/deploy/nginx/certs:/etc/nginx/certs:ro" \
            nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 `# 1.27-alpine, matches deploy/nginx/Dockerfile` \
            nginx -t

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          find deploy scripts -type f -name "*.sh" -print0 | xargs -0 --no-run-if-empty shellcheck

  # Always-report gate (#232): owns the required check-run name. Runs on
  # every PR/push regardless of the path filter (`if: always()` — GitHub's
  # documented construct for a required check that depends on other jobs).
  # A job skipped by its own condition reports Success to a required check,
  # so the gate must never skip: on a cancelled run it still runs, sees
  # `changes.result` == `cancelled` and fails, which is the honest answer
  # for a run that verified nothing. The gate also treats a skipped
  # `deploy` job (off-path PR) the same as a successful one, so a
  # backend-only or docs-only PR shows this context green instead of
  # forever pending.
  deploy-gate:
    name: "compose config, nginx -t, shellcheck"
    needs: [changes, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `changes.result` is checked explicitly, not just `deploy.result`: a
      # `changes` failure skips `deploy` exactly the way an off-path PR
      # would, and the two are indistinguishable from `deploy.result` alone.
      - name: Require success or skip
        run: |
          changes_result="${{ needs.changes.result }}"
          job_result="${{ needs.deploy.result }}"
          echo "changes job result: $changes_result"
          echo "deploy job result: $job_result"
          if [ "$changes_result" != "success" ]; then
            echo "changes job did not succeed ($changes_result) -- failing gate"
            exit 1
          fi
          case "$job_result" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
