name: backend

# Always-report pattern (issue #232): this workflow runs on every PR/push to
# main, but the real work is skipped unless backend-relevant paths changed.
# A `changes` job (dorny/paths-filter) decides that once; every real job
# below is gated on its output (`if: needs.changes.outputs.backend ==
# 'true'`), and a final `backend-gate` job — the one that owns the required
# check-run name `build, test, coverage` — always runs (`if: always()`,
# GitHub's documented construct for a required check that depends on other
# jobs; a job skipped by its own condition reports Success to a required
# check, so the gate must never skip — on a cancelled run it runs, sees
# `changes.result` == `cancelled` and fails, which is the honest answer for
# a run that verified nothing) and reports success only when BOTH `changes`
# itself succeeded AND the real job succeeded or was skipped; any other
# combination (including a `changes` failure, which would otherwise look
# exactly like an off-path skip) fails the gate. This is what makes the
# context eligible to be a required check (a GitHub required check that a
# path filter can make "never runs" would otherwise deadlock every PR that
# doesn't touch the path — see #232).
#
# docs/explanation/compliance-content-shape-inventory.md is listed too, even though it is a
# doc: the `pester` job below treats that document as the shape inventory's
# source of truth and fails when a row is deleted, added without a fixture, or
# has its Expected verdict edited to disagree with the corpus (issue #1099).
# Without this path a documentation-only edit could disarm a shape with CI green.
#
# Directory.Build.props, .editorconfig and scripts/check-coverage-floor.py are
# shared inputs that control the checks above (build analyzers and severities,
# and the coverage gate) — issue #412. scripts/tests/** is listed for the
# same reason: it is that gate script's own unittest suite, run by the
# coverage-gate-tests job below (issue #1710).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether the paths below changed. On pull_request events this
  # calls the GitHub API (needs `pull-requests: read`, no checkout depth
  # required); on push-to-main it walks git history against
  # `github.event.before` instead, which needs that commit to be present
  # locally, hence `fetch-depth: 0` only for the push case (a shallow
  # checkout is enough — and cheaper — on pull_request).
  # The condition is written on `pull_request` rather than on `push`
  # deliberately: GitHub coerces `0` to false in expressions, so
  # `event_name == 'push' && 0 || 1` would yield 1 on every event. With
  # `event_name == 'pull_request' && 1 || 0` the chosen value is truthy on
  # the pull_request branch and is the `||` fallback on the push branch, so
  # each event actually gets the depth it needs.
  changes:
    name: "changes: backend"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - "backend/**"
              - "docs/explanation/compliance-content-shape-inventory.md"
              - "Directory.Build.props"
              - ".editorconfig"
              - "scripts/check-coverage-floor.py"
              - "scripts/tests/**"
              - ".github/workflows/backend.yml"

  backend:
    name: "build, test, coverage (job)"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "8.0.x"

      # No packages.lock.json exists (RestorePackagesWithLockFile is unset),
      # so setup-dotnet's built-in `cache:` input has nothing to key off.
      # Cache the NuGet package cache directly, keyed on the .csproj files
      # that declare every PackageReference.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: backend
        run: dotnet restore Waypoint.sln

      # Warnings as errors: a regression that only warns locally must fail
      # the gate here, per the issue's job matrix.
      - name: Build (warnings as errors)
        working-directory: backend
        run: dotnet build Waypoint.sln --no-restore -warnaserror

      - name: Test (with coverage)
        working-directory: backend
        run: >
          dotnet test Waypoint.sln --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/TestResults
          retention-days: 14

      # Coverage FLOOR gate (issue #102). Issue #79 asked for a true
      # no-regression check (compare against the base branch) in preference
      # to a fixed floor, but this appliance is fully air-gapped (CLAUDE.md,
      # ADR-0007) — no Codecov/Coveralls/external service to store a
      # baseline in, and a self-hosted no-regression check would need a
      # baseline persisted across runs or committed to the repo. Left as a
      # documented future option (see scripts/check-coverage-floor.py's
      # header). What's here instead: a committed floor enforced by a
      # self-contained, network-free script reading the Cobertura report
      # this job already produces.
      #
      # Floor = 88.0% line coverage. The floor is being established at the
      # codebase's CURRENT true coverage, not an old high-water mark: it
      # measured 88.84% on 2026-08-09 (CI on PR #391, current main + this
      # PR, which adds no product code — only the gate). The earlier 91.92%
      # figure predated ~78 M2 commits that shifted the real number down;
      # baselining the gate at reality with a small headroom is correct, and
      # is NOT lowering the floor to wave through a regression (this PR
      # introduces none). To ratchet up: re-measure with a fresh
      # `dotnet test --collect:"XPlat Code Coverage"`, confirm the new number
      # holds, then raise --floor here (never lower it to chase a regression).
      - name: Coverage gate (floor)
        run: >
          python3 scripts/check-coverage-floor.py
          --report "backend/TestResults/**/coverage.cobertura.xml"
          --format cobertura
          --floor 88.0
          --metric line

  # Issue #1099's PowerShell half of the compliance-content shape inventory. The
  # C# parsers' inventories are enforced by `dotnet test` (the `backend` job
  # above), but Get-WaypointProfileDeclaredInputNameSet is PowerShell, so its
  # guard is Pester and nothing in `dotnet test` executes it. Without this job
  # the entire PowerShell inventory -- doc<->corpus completeness, the Expected
  # column, issue #1152's regression fixture and all 21 shapes -- would only run
  # when a human remembered to type the Invoke-Pester line, which is exactly the
  # rot that let issue #1071 happen (PR #1151 round-1 review, finding 1).
  #
  # Separate job rather than a step in `backend`: it needs no .NET SDK, no
  # restore and no coverage, so it gives its own fast red/green signal. Not a
  # required check (see docs/process/testing.md), so it stays plain
  # path-gated rather than growing its own always-report gate.
  pester:
    name: "pester: powershell shape inventory"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # pwsh is preinstalled on ubuntu-latest, but Pester is not shipped with
      # PowerShell on Linux. Pinned to the same major/minor the suites are
      # developed against so a gallery release cannot change the gate's meaning
      # without a deliberate bump here.
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.0.1
          "Pester $((Get-Module Pester).Version)"

      # Both suites in one run. The real-content conformance suite is safe here:
      # it self-skips (Set-ItResult -Skipped) when no local vendor clone is
      # present, which a GitHub runner never has -- the opt-in semantics the doc
      # advertises are preserved, and running it keeps the file from rotting
      # into a syntax error nobody notices.
      - name: Shape inventory (Pester)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'backend/Waypoint.Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          $result = Invoke-Pester -Configuration $config
          "Pester: $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped"
          if ($result.FailedCount -gt 0) {
            throw "Pester shape-inventory guard failed: $($result.FailedCount) failed test(s). A broken shape in WaypointScan.psm1, a missing corpus fixture, or a deleted/edited row of docs/explanation/compliance-content-shape-inventory.md all surface here."
          }
          if ($result.PassedCount -eq 0) {
            throw "Pester discovered no tests -- the guard is not actually running."
          }

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: pester-shape-inventory
          path: testResults.xml
          retention-days: 14

  # Issue #1237: backend/docker-entrypoint.sh's half of the entrypoint-lint
  # gap (the two runner entrypoints are covered by download-runner.yml and
  # compliance-runner.yml's own shellcheck jobs, #1356/#1355). Mirrors those
  # jobs' step verbatim apart from the path.
  shellcheck:
    name: "shellcheck (job)"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: shellcheck
        run: |
          set -eu
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          entrypoint="backend/docker-entrypoint.sh"
          if [ ! -f "$entrypoint" ]; then
            echo "::error::expected $entrypoint to exist" >&2
            exit 1
          fi
          shellcheck "$entrypoint"

  # Issue #1710: scripts/check-coverage-floor.py gained a scripts/tests/
  # unittest suite (issue #1354) with no CI job running it. Separate job
  # rather than a step in `backend`: it needs no .NET SDK or restore, so it
  # gives its own fast red/green signal. Guards against zero-tests-discovered
  # the same way the `pester` job above (L214-L217) and the
  # download-runner/compliance-runner workflows' own gates do: plain
  # `unittest discover` exits 0 on an empty suite, so a rename/move/delete of
  # the test file would otherwise leave this job green while running
  # nothing -- the exact "suite exists, nothing runs it" failure mode #1710
  # exists to close (review finding, PR #1730 round 1).
  coverage-gate-tests:
    name: "coverage-gate tests (job)"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run scripts/tests unittest suite
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.TestLoader().discover("scripts/tests")
          count = suite.countTestCases()
          print(f"discovered {count} test case(s)")
          if count == 0:
              print(
                  "::error::coverage-gate-tests discovered zero tests -- "
                  "the guard is not actually running.",
                  file=sys.stderr,
              )
              sys.exit(1)

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  # Always-report gate (#232): owns the required check-run name. Runs on
  # every PR/push regardless of the path filter (`if: always()` — GitHub's
  # documented construct for a required check that depends on other jobs).
  # A job skipped by its own condition reports Success to a required check,
  # so the gate must never skip: on a cancelled run it still runs, sees
  # `changes.result` == `cancelled` and fails, which is the honest answer
  # for a run that verified nothing. The gate also treats a skipped
  # `backend`/`shellcheck` job (off-path PR) the same as a successful one,
  # so a docs-only PR shows this context green instead of forever pending.
  backend-gate:
    name: "build, test, coverage"
    needs: [changes, backend, shellcheck, coverage-gate-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `changes.result` is checked explicitly, not just `backend.result`:
      # a `changes` failure (e.g. the paths-filter API call erroring) skips
      # `backend` exactly the way an off-path PR would, and the two are
      # indistinguishable from `backend.result` alone. Requiring `changes`
      # to have actually succeeded closes that hole.
      - name: Require success or skip
        run: |
          changes_result="${{ needs.changes.result }}"
          job_result="${{ needs.backend.result }}"
          shellcheck_result="${{ needs.shellcheck.result }}"
          coverage_gate_tests_result="${{ needs.coverage-gate-tests.result }}"
          echo "changes job result: $changes_result"
          echo "backend job result: $job_result"
          echo "shellcheck job result: $shellcheck_result"
          echo "coverage-gate-tests job result: $coverage_gate_tests_result"
          if [ "$changes_result" != "success" ]; then
            echo "changes job did not succeed ($changes_result) -- failing gate"
            exit 1
          fi
          status=0
          case "$job_result" in
            success|skipped) ;;
            *) status=1 ;;
          esac
          case "$shellcheck_result" in
            success|skipped) ;;
            *) status=1 ;;
          esac
          case "$coverage_gate_tests_result" in
            success|skipped) ;;
            *) status=1 ;;
          esac
          exit "$status"
