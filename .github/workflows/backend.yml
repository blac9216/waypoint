name: backend

# Path-filtered: only backend/** changes (or this workflow file) trigger a
# build. A docs-only or frontend-only PR never runs this job (see #79).
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: build, test, coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "8.0.x"

      # No packages.lock.json exists (RestorePackagesWithLockFile is unset),
      # so setup-dotnet's built-in `cache:` input has nothing to key off.
      # Cache the NuGet package cache directly, keyed on the .csproj files
      # that declare every PackageReference.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: backend
        run: dotnet restore Waypoint.sln

      # Warnings as errors: a regression that only warns locally must fail
      # the gate here, per the issue's job matrix.
      - name: Build (warnings as errors)
        working-directory: backend
        run: dotnet build Waypoint.sln --no-restore -warnaserror

      - name: Test (with coverage)
        working-directory: backend
        run: >
          dotnet test Waypoint.sln --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/TestResults
          retention-days: 14

      # Coverage FLOOR gate (issue #102). Issue #79 asked for a true
      # no-regression check (compare against the base branch) in preference
      # to a fixed floor, but this appliance is fully air-gapped (CLAUDE.md,
      # ADR-0007) — no Codecov/Coveralls/external service to store a
      # baseline in, and a self-hosted no-regression check would need a
      # baseline persisted across runs or committed to the repo. Left as a
      # documented future option (see scripts/check-coverage-floor.py's
      # header). What's here instead: a committed floor enforced by a
      # self-contained, network-free script reading the Cobertura report
      # this job already produces.
      #
      # Floor = 88.0% line coverage. The floor is being established at the
      # codebase's CURRENT true coverage, not an old high-water mark: it
      # measured 88.84% on 2026-08-09 (CI on PR #391, current main + this
      # PR, which adds no product code — only the gate). The earlier 91.92%
      # figure predated ~78 M2 commits that shifted the real number down;
      # baselining the gate at reality with a small headroom is correct, and
      # is NOT lowering the floor to wave through a regression (this PR
      # introduces none). To ratchet up: re-measure with a fresh
      # `dotnet test --collect:"XPlat Code Coverage"`, confirm the new number
      # holds, then raise --floor here (never lower it to chase a regression).
      - name: Coverage gate (floor)
        run: >
          python3 scripts/check-coverage-floor.py
          --report "backend/TestResults/**/coverage.cobertura.xml"
          --format cobertura
          --floor 88.0
          --metric line
