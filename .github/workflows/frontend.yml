name: frontend

# Always-report pattern (issue #232): see backend.yml's header for the full
# rationale. A `changes` job decides whether frontend-relevant paths
# changed; the real `frontend` job is gated on that output, and
# `frontend-gate` — the job that owns the required check-run name
# `build, test, lint` — always runs (`if: always()`, so a cancelled run
# fails the gate instead of skipping it, since a skipped job would report
# Success to a required check) and reports success only when BOTH
# `changes` succeeded AND the real job succeeded or was skipped, failure
# otherwise (a `changes` failure would otherwise look exactly like an
# off-path skip).
#
# scripts/check-coverage-floor.py is a shared input that controls the
# coverage gate below — issue #412.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # On pull_request events dorny/paths-filter calls the GitHub API (needs
  # `pull-requests: read`, no checkout depth required); on push-to-main it
  # walks git history against `github.event.before` instead, which needs
  # that commit present locally, hence `fetch-depth: 0` only for the push
  # case (a shallow checkout is enough — and cheaper — on pull_request).
  # The condition is written on `pull_request` rather than on `push`
  # deliberately: GitHub coerces `0` to false in expressions, so
  # `event_name == 'push' && 0 || 1` would yield 1 on every event. With
  # `event_name == 'pull_request' && 1 || 0` the chosen value is truthy on
  # the pull_request branch and is the `||` fallback on the push branch, so
  # each event actually gets the depth it needs.
  changes:
    name: "changes: frontend"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - "scripts/check-coverage-floor.py"
              - ".github/workflows/frontend.yml"

  frontend:
    name: "build, test, lint (job)"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Build (typecheck + vite build)
        run: npm run build

      # The gate that matters most in this job, run as its own step on
      # purpose. `npm run build` already chains this guard as its last step,
      # and that wiring stays (it protects local developers, who are the
      # people most likely to introduce an external asset in the first
      # place) — but CI must not depend on it. Deleting `&& npm run
      # check:external-assets` from package.json's build script would
      # otherwise leave this whole job green with the ADR-0007 air-gap guard
      # never executed: build exits 0, tests exit 0, and the guard's own unit
      # tests still pass because they import the module directly and assert
      # nothing about the wiring.
      #
      # This guard has a history of failing open — an extension allowlist
      # that skipped .mjs (PR #65 round 1), compressed artifacts skipped
      # entirely (#77), and compressed formats on neither list (#81) — which
      # is the whole reason issue #79 asked for it on a gate rather than in a
      # habit. Re-running it here is idempotent and costs about a second
      # against the already-built dist/; it hard-fails if the script is
      # missing, renamed, or unwired.
      - name: Air-gap asset guard (ADR-0007)
        run: npm run check:external-assets

      # Coverage collection (issue #102 — frontend previously ran `vitest
      # run` with no coverage at all). "json-summary" is emitted by
      # vitest.config.ts's coverage reporter list alongside "text"/"html";
      # no new dependency — @vitest/coverage-v8 is already vendored.
      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      # Coverage FLOOR gate (issue #102), same rationale and script as
      # backend.yml — see scripts/check-coverage-floor.py's header for why
      # this is a floor and not issue #79's true no-regression check
      # (air-gapped: no external baseline service).
      #
      # Floor = 88.0% line coverage, measured at 90.12% on 2026-08-08
      # (165/165 tests passing, commit f2aadfe) and rounded down ~2 points
      # for headroom. To ratchet up: re-measure locally with `npm run
      # test:coverage`, confirm the new number holds, then raise --floor
      # here (never lower it to accommodate a regression).
      - name: Coverage gate (floor)
        working-directory: ${{ github.workspace }}
        run: >
          python3 scripts/check-coverage-floor.py
          --report "frontend/coverage/coverage-summary.json"
          --format vitest-json-summary
          --floor 88.0
          --metric line

      - name: Lint
        run: npm run lint

  # Always-report gate (#232): owns the required check-run name. Runs on
  # every PR/push regardless of the path filter (`if: always()` — GitHub's
  # documented construct for a required check that depends on other jobs).
  # A job skipped by its own condition reports Success to a required check,
  # so the gate must never skip: on a cancelled run it still runs, sees
  # `changes.result` == `cancelled` and fails, which is the honest answer
  # for a run that verified nothing. The gate also treats a skipped
  # `frontend` job (off-path PR) the same as a successful one, so a
  # backend-only or docs-only PR shows this context green instead of
  # forever pending.
  frontend-gate:
    name: "build, test, lint"
    needs: [changes, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `changes.result` is checked explicitly, not just `frontend.result`:
      # a `changes` failure skips `frontend` exactly the way an off-path PR
      # would, and the two are indistinguishable from `frontend.result`
      # alone.
      - name: Require success or skip
        run: |
          changes_result="${{ needs.changes.result }}"
          job_result="${{ needs.frontend.result }}"
          echo "changes job result: $changes_result"
          echo "frontend job result: $job_result"
          if [ "$changes_result" != "success" ]; then
            echo "changes job did not succeed ($changes_result) -- failing gate"
            exit 1
          fi
          case "$job_result" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
