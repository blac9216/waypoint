name: skills-shellcheck

# Always-report pattern (issue #232): see backend.yml's header for the full
# rationale. A `changes` job decides whether .claude/skills/**/*.sh changed;
# the two real jobs below are each gated on that output, and a matching
# gate job owns each required check-run name (`shellcheck .claude/skills`,
# `test .claude/skills`), running whenever the run itself was not cancelled
# and reporting success only when BOTH `changes` succeeded AND its real job
# succeeded or was skipped, so both report on every PR (a `changes` failure
# would otherwise look exactly like an off-path skip).
#
# deploy.yml's own shellcheck step only searches deploy/ and scripts/, so
# scripts under .claude/skills/ (agent-facing automation, not deploy
# tooling) were never linted anywhere in CI — see issue #1231.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: skills-shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # On pull_request events dorny/paths-filter calls the GitHub API (needs
  # `pull-requests: read`, no checkout depth required); on push-to-main it
  # walks git history against `github.event.before` instead, which needs
  # that commit present locally, hence `fetch-depth: 0` only for the push
  # case (a shallow checkout is enough — and cheaper — on pull_request).
  changes:
    name: "changes: .claude/skills"
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            skills:
              - ".claude/skills/**/*.sh"
              - ".github/workflows/skills-shellcheck.yml"

  shellcheck:
    name: "shellcheck .claude/skills (job)"
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # No global --shell=bash: that would be a dialect override, not a
      # shebang-gap filler — it makes shellcheck judge every file as bash
      # regardless of its own shebang, which suppresses the whole SC3xxx
      # "bashism in a POSIX sh script" family, exactly the class -S warning
      # exists to catch (#1330). configure-workflow's _lib.sh is the one
      # shebang-less sourced helper here, so it self-declares its dialect
      # with a `# shellcheck shell=bash` directive instead; every other
      # script carries its own shebang and needs nothing.
      #
      # -S warning: tightened from -S error by #1235 once the sole warning-tier
      # finding (_lib.sh SC2034 on MANIFESTS, consumed only by sourcing scripts)
      # was fixed with a directive. info/style-tier findings remain unenforced
      # (tracked separately, not this issue's scope — see issue #1235).
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          find .claude/skills -type f -name "*.sh" -print0 | \
            xargs -0 --no-run-if-empty shellcheck -S warning

  # Always-report gate (#232): owns the required check-run name. Runs on
  # every PR/push regardless of the path filter (`if: ${{ !cancelled() }}`,
  # so a cancelled run reports failure rather than a stale/false green), and
  # treats a skipped `shellcheck` job (off-path PR) the same as a successful
  # one, so a docs-only or backend-only PR shows this context green instead
  # of forever pending.
  shellcheck-gate:
    name: "shellcheck .claude/skills"
    needs: [changes, shellcheck]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `changes.result` is checked explicitly, not just `shellcheck.result`:
      # a `changes` failure skips `shellcheck` exactly the way an off-path
      # PR would, and the two are indistinguishable from `shellcheck.result`
      # alone.
      - name: Require success or skip
        run: |
          changes_result="${{ needs.changes.result }}"
          job_result="${{ needs.shellcheck.result }}"
          echo "changes job result: $changes_result"
          echo "shellcheck job result: $job_result"
          if [ "$changes_result" != "success" ]; then
            echo "changes job did not succeed ($changes_result) -- failing gate"
            exit 1
          fi
          case "$job_result" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  skills-tests:
    name: "test .claude/skills (job)"
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Regression tests for skill scripts live at .claude/skills/**/tests/*.sh
      # and are self-contained (mocked gh on PATH, no network, fixtures
      # invented) — see issue #1345. en_US.UTF-8 is required, not merely
      # preferred: the locale digit-class trap these tests bind (bash [0-9]
      # as a collation range under glibc) is invisible under LC_ALL=C, and
      # ubuntu-latest runner images ship en_US.UTF-8 pre-generated.
      - name: run skill script tests
        run: |
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          locale -a | grep -qi '^en_US\.utf8$'
          find .claude/skills -type f -path "*/tests/*.sh" -print0 | \
            xargs -0 --no-run-if-empty -n1 bash

      # Soft gate (#1349): every scripts/*.sh in a skill that already has a
      # tests/ dir must be mentioned (by name) from at least one file in
      # that tests/ dir, so a new script can't silently ship with zero
      # coverage the way history.sh did (#1345/#1348). Deliberately scoped
      # to skills that already have a tests/ dir — configure-workflow's 8
      # scripts have no tests/ dir at all yet and are NOT retroactively
      # failed by this check; see issue #1349 for that scoping decision.
      #
      # Tightened by #1359 in two ways, after #1352's review found the check
      # weaker than its step name/error text implied:
      #  - a whole-line `#` comment mention no longer satisfies the check
      #    (grep -v strips full-comment lines before matching) — this closes
      #    the exact probe #1359 verified (`# mentions untested.sh only in a
      #    comment`). A same-line trailing comment after real code still
      #    counts as a mention; distinguishing that would need a shell
      #    parser, not a grep, so it's accepted as a residual gap — the gate
      #    stays a soft "is this name mentioned anywhere runnable" check, not
      #    proof of execution or coverage, and the step name/error text below
      #    say "mentions"/"mentioned", not "references"/"tested", to match.
      #  - discovery is now depth-independent (no `-maxdepth 2` on the `find
      #    ... -name tests` scan), so a skill with tests/ nested deeper than
      #    <skill>/tests is no longer silently skipped. No such layout exists
      #    today.
      - name: lint — new skill scripts are mentioned in a test
        run: |
          fail=0
          while IFS= read -r -d '' tests_dir; do
            skill_dir="$(dirname "$tests_dir")"
            scripts_dir="$skill_dir/scripts"
            [ -d "$scripts_dir" ] || continue
            while IFS= read -r -d '' script; do
              name="$(basename "$script")"
              if ! grep -h -v '^[[:space:]]*#' "$tests_dir"/*.sh 2>/dev/null | grep -q -- "$name"; then
                echo "::error file=$script::no test in $tests_dir mentions $name outside a comment (see issue #1349)"
                fail=1
              fi
            done < <(find "$scripts_dir" -maxdepth 1 -type f -name "*.sh" -print0)
          done < <(find .claude/skills -type d -name tests -print0)
          exit "$fail"

  # Always-report gate (#232): owns the required check-run name. Runs on
  # every PR/push regardless of the path filter (`if: ${{ !cancelled() }}`,
  # so a cancelled run reports failure rather than a stale/false green), and
  # treats a skipped `skills-tests` job (off-path PR) the same as a
  # successful one, so a docs-only or backend-only PR shows this context
  # green instead of forever pending.
  skills-tests-gate:
    name: "test .claude/skills"
    needs: [changes, skills-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `changes.result` is checked explicitly, not just
      # `skills-tests.result`: a `changes` failure skips `skills-tests`
      # exactly the way an off-path PR would, and the two are
      # indistinguishable from `skills-tests.result` alone.
      - name: Require success or skip
        run: |
          changes_result="${{ needs.changes.result }}"
          job_result="${{ needs.skills-tests.result }}"
          echo "changes job result: $changes_result"
          echo "skills-tests job result: $job_result"
          if [ "$changes_result" != "success" ]; then
            echo "changes job did not succeed ($changes_result) -- failing gate"
            exit 1
          fi
          case "$job_result" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
