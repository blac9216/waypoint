name: skills-shellcheck

# Path-filtered: only .claude/skills/**/*.sh changes (or this workflow file)
# trigger the job. deploy.yml's own shellcheck step only searches
# deploy/ and scripts/, so scripts under .claude/skills/ (agent-facing
# automation, not deploy tooling) were never linted anywhere in CI — see
# issue #1231.
on:
  pull_request:
    paths:
      - ".claude/skills/**/*.sh"
      - ".github/workflows/skills-shellcheck.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/**/*.sh"
      - ".github/workflows/skills-shellcheck.yml"

concurrency:
  group: skills-shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck .claude/skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # No global --shell=bash: that would be a dialect override, not a
      # shebang-gap filler — it makes shellcheck judge every file as bash
      # regardless of its own shebang, which suppresses the whole SC3xxx
      # "bashism in a POSIX sh script" family, exactly the class -S warning
      # exists to catch (#1330). configure-workflow's _lib.sh is the one
      # shebang-less sourced helper here, so it self-declares its dialect
      # with a `# shellcheck shell=bash` directive instead; every other
      # script carries its own shebang and needs nothing.
      #
      # -S warning: tightened from -S error by #1235 once the sole warning-tier
      # finding (_lib.sh SC2034 on MANIFESTS, consumed only by sourcing scripts)
      # was fixed with a directive. info/style-tier findings remain unenforced
      # (tracked separately, not this issue's scope — see issue #1235).
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          find .claude/skills -type f -name "*.sh" -print0 | \
            xargs -0 --no-run-if-empty shellcheck -S warning

  skills-tests:
    name: test .claude/skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Regression tests for skill scripts live at .claude/skills/**/tests/*.sh
      # and are self-contained (mocked gh on PATH, no network, fixtures
      # invented) — see issue #1345. en_US.UTF-8 is required, not merely
      # preferred: the locale digit-class trap these tests bind (bash [0-9]
      # as a collation range under glibc) is invisible under LC_ALL=C, and
      # ubuntu-latest runner images ship en_US.UTF-8 pre-generated.
      - name: run skill script tests
        run: |
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          locale -a | grep -qi '^en_US\.utf8$'
          find .claude/skills -type f -path "*/tests/*.sh" -print0 | \
            xargs -0 --no-run-if-empty -n1 bash

      # Soft gate (#1349): every scripts/*.sh in a skill that already has a
      # tests/ dir must be referenced (by name) from at least one file in
      # that tests/ dir, so a new script can't silently ship with zero
      # coverage the way history.sh did (#1345/#1348). Deliberately scoped
      # to skills that already have a tests/ dir — configure-workflow's 8
      # scripts have no tests/ dir at all yet and are NOT retroactively
      # failed by this check; see issue #1349 for that scoping decision.
      - name: lint — new skill scripts ship with a test
        run: |
          fail=0
          while IFS= read -r -d '' tests_dir; do
            skill_dir="$(dirname "$tests_dir")"
            scripts_dir="$skill_dir/scripts"
            [ -d "$scripts_dir" ] || continue
            while IFS= read -r -d '' script; do
              name="$(basename "$script")"
              if ! grep -rlq -- "$name" "$tests_dir"/*.sh 2>/dev/null; then
                echo "::error file=$script::no test in $tests_dir references $name (see issue #1349)"
                fail=1
              fi
            done < <(find "$scripts_dir" -maxdepth 1 -type f -name "*.sh" -print0)
          done < <(find .claude/skills -maxdepth 2 -type d -name tests -print0)
          exit "$fail"
