name: sanitize

# Hard gate, no path filter: every PR and every push to main is scanned,
# regardless of which directory changed. This is the mechanical enforcement
# of the public-repo sanitization policy in CLAUDE.md (see issue #79) — a
# docs-only change still gets scanned, since a leaked hostname or token is
# just as real in a markdown file as in code.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sanitize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitize:
    name: secret + identifier scan
    runs-on: ubuntu-latest
    steps:
      # Plain `pull_request`, never `pull_request_target` — a fork PR gets
      # no privileged token or repo secret access (issue #79 constraint).
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # full history: the PR-range scan (origin/<base>..HEAD)
          # and the push-to-main full scan both need every commit present (#329)

      # The gate's own logic, verified before the gate is trusted. Running
      # the scanner against a clean tree proves only that it found nothing —
      # it cannot distinguish "no findings" from "detector broken". These
      # tests assert the other half: that each detector still fires on the
      # pattern class it exists to catch (issue #90). Stdlib unittest, so
      # there is no dependency to install and nothing to keep in sync.
      # Deliberately first: a broken detector should be reported as a broken
      # detector, not masked by whatever else fails afterwards.
      - name: Sanitization scanner self-tests
        working-directory: .github/sanitize
        run: python3 -m unittest discover -p 'test_*.py' -v

      # Generic secret/credential shapes: private keys, JWTs, cloud
      # provider keys, high-entropy generic tokens, etc. No GITHUB_TOKEN
      # and no repository secret is used anywhere in this job — the run
      # simply fails if gitleaks finds something; nothing is posted back
      # to the PR by an authenticated call.
      #
      # gitleaks scans commit history (not just the working tree), so a
      # secret a PR adds and then removes in a later commit is still caught.
      # But scanning the ENTIRE fetched object store means that on a busy
      # repo the runner can hold commits from other in-flight/merged branches,
      # and a secret-shaped fixture in one of THOSE foreign commits fails an
      # unrelated PR (issue #329). So the scan scope follows the event:
      #   - pull_request: only commits unique to this PR (origin/<base>..HEAD)
      #   - push to main: full reachable history (main's object store holds no
      #     foreign branches; a full sweep of the canonical branch is the
      #     belt-and-suspenders the public-repo policy wants).
      # A PR that legitimately commits a synthetic secret *fixture* (e.g. in
      # the sanitize self-tests) should mark that line with an inline
      # `gitleaks:allow` comment, which gitleaks honours.
      - name: gitleaks secret scan
        env:
          BASE_REF: ${{ github.base_ref }} # non-empty only on pull_request
        run: |
          if [ -n "$BASE_REF" ]; then
            # Guarantee the base tracking ref exists, then scope to this PR's
            # own commit range. `--log-opts=<a>..<b>` stays a single token
            # (no space), so the unquoted expansion below is one argv element.
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            LOG_OPTS="--log-opts=origin/$BASE_REF..HEAD"
            echo "gitleaks scope: PR range origin/$BASE_REF..HEAD"
          else
            LOG_OPTS=""
            echo "gitleaks scope: full reachable history"
          fi
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f `# v8.30.1` \
            detect --source /repo --redact -v $LOG_OPTS

      # Repo-specific patterns gitleaks doesn't know about: lab FQDNs,
      # non-RFC-5737 IP addresses, and Broadcom/VMware depot-token shapes.
      # See the script's header comment for exactly what is and isn't
      # flagged, and CLAUDE.md for the policy this mechanises.
      - name: Repo-specific sanitization scan
        run: python3 .github/sanitize/scan_repo_specific.py
